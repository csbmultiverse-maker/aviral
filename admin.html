<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AVIRAL Admin</title>
<style>
:root{
  --bg:#f6f6f4;--surface:#fcfcfb;--ink:#1d1d1b;--ink2:#55554f;--muted:#7a7a72;--line:#e3e3de;--grid:#ececE7;
  --accent:#3f5fd0;--accent-ink:#fff;--warn:#b4560a;--danger:#b3261e;
  --s1:#3f5fd0;--s2:#11a7c9;--s3:#79a822;--s4:#d93a70;--s5:#ea9420;--s6:#8a54c9;
  --q1:#dbe3fa;--q2:#a9b9ee;--q3:#7b92e2;--q4:#516ed6;--q5:#2c47a8;
  --dvlo:#3f5fd0;--dvmid:#e7e7e2;--dvhi:#ea9420;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121211;--surface:#1a1a19;--ink:#f0f0ec;--ink2:#c3c3bb;--muted:#8d8d85;--line:#2e2e2b;--grid:#272725;
  --accent:#6f86ee;--accent-ink:#0d0d0c;--warn:#e0a04a;--danger:#f2837c;
  --s1:#4d63dc;--s2:#0e9fa8;--s3:#6f9c1f;--s4:#e05080;--s5:#c87c14;--s6:#9a6ce0;
  --q1:#2a3463;--q2:#34479a;--q3:#4a63cc;--q4:#7389ea;--q5:#b4c1f8;
  --dvlo:#4d63dc;--dvmid:#33332f;--dvhi:#c87c14;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:20px}h2{font-size:15px}h3{font-size:13px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.brand small{color:var(--muted)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink2)}
.sp{flex:1}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{margin-bottom:2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:900px){.g6{grid-template-columns:repeat(3,1fr)}.g4,.g3{grid-template-columns:repeat(2,1fr)}.g2,.g21,.g12{grid-template-columns:1fr}}
@media(max-width:520px){.g6,.g4,.g3{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
.kpi .d{color:var(--ink2);font-size:12px;margin-top:4px}
.insights{margin:0;padding-left:18px;color:var(--ink2)}
.insights li{margin:3px 0}.insights b{color:var(--ink)}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;margin:5px 0}
.hb .lab{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{height:14px;background:var(--grid);border-radius:4px;position:relative;overflow:hidden}
.hb .bar{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hb .val{font-variant-numeric:tabular-nums;color:var(--ink);min-width:70px;text-align:right}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--muted);font:11px system-ui,sans-serif}
svg .ax{stroke:var(--line);stroke-width:1}svg .gr{stroke:var(--grid);stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink2);font-size:12.5px;margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--grid)}
.scroll{overflow:auto;max-height:520px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.stk{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.stk span{display:block;height:100%}
.hm{display:grid;gap:2px}
.hm div{display:flex;align-items:center;justify-content:center;min-height:34px;border-radius:4px;font-size:12px;color:#111;font-variant-numeric:tabular-nums}
.hm .h{background:transparent;color:var(--muted);font-size:11.5px;min-height:24px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;max-width:260px;opacity:0;transition:opacity .08s;white-space:pre-line}
.empty{color:var(--muted);padding:18px;text-align:center}
.login{max-width:420px;margin:12vh auto;padding:24px}
.login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:10px 0}
.msg{margin-top:10px;color:var(--ink2)}.msg.err{color:var(--danger)}
.detail{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;overflow:auto;padding:20px}
.detail.open{display:block}
.detail .panel{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.qa{border-top:1px solid var(--line);padding:8px 0}
.qa .q{color:var(--ink2)}.qa .a{font-weight:600}
.mute{color:var(--muted)}
.tabs{margin:2px 0 10px}
details summary{cursor:pointer;color:var(--ink2)}
.opt-row{margin:6px 0}
.chip{font-size:11.5px;color:var(--muted);margin-left:6px}
@media print{.filters,.top .btn,.noprint{display:none}}
</style>
</head>

ral angles, including ones I don't like."},{"d":"lakshya","k":-1,"rig":0,"src":"New","t":"I regularly learn something new, even when no one requires it."},{"d":"indriyajaya","k":-1,"rig":0,"src":"New","t":"I admit my mistakes openly, even when it costs me."}],"CH":[{"chk":"att","want":1,"t":"To show you're reading carefully, please choose “Disagree” for this statement."},{"chk":"att","want":4,"t":"This is a check question: please select “Strongly agree”."},{"chk":"sd","want":null,"t":"I have never been annoyed with anyone."},{"chk":"sd","want":null,"t":"I always keep every promise I make, without exception."},{"chk":"sd","want":null,"t":"I have never said something I later regretted."}],"LIK":["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"]};

    return '<div style="margin-top:12px;min-width:0"><div class="mute" style="font-size:12px">Version '+(vi+1)+' · '+plural(n,"answer")+'</div><div style="margin:2px 0 6px"><b>'+esc(v.q)+'</b></div>'+
    v.o.map(function(o,oi){var p=pct(counts[oi],n);return '<div class="opt-row"><div style="display:flex;justify-content:space-between;gap:10px"><span>'+esc(o[0])+'<span class="chip">growth need '+o[1]+(o[2]?' · blunt':'')+'</span></span><span class="mute" style="white-space:nowrap">'+counts[oi]+' · '+p+'%</span></div>'+
      '<div class="trk" style="height:10px;background:var(--grid);border-radius:4px;overflow:hidden;margin-top:3px"><span style="display:block;height:100%;width:'+p+'%;background:'+(o[2]?"var(--s4)":"var(--s1)")+';border-radius:0 4px 4px 0"></span></div></div>'}).join("")+'</div>'}).join("");
  return '<div class="card"><h2>Part A: scenario patterns</h2><p class="sub">Pick a scenario in the table to see how people answered each version below. Growth need runs 0 (healthiest) to 10. Blunt options are shown in pink.</p>'+tbl+'<div class="grid g2" style="margin:0">'+det+'</div></div>';
}
function partBCard(R){
  var rows=META.PB.map(function(q,i){
    var c=[0,0,0,0,0],pts=[];R.forEach(function(r){var v=r.b[i];if(v!=null&&v>=0&&v<=4){c[v]++;pts.push(q.k>0?v*2.5:(4-v)*2.5)}});
    var n=c[0]+c[1]+c[2]+c[3]+c[4];return{i:i,q:q,c:c,n:n,avg:mean(pts)};
  }).sort(function(a,b){return (b.avg==null?-1:b.avg)-(a.avg==null?-1:a.avg)});
  var cols=["var(--q1)","var(--q2)","var(--q3)","var(--q4)","var(--q5)"];
  var h='<div class="legend">'+META.LIK.map(function(l,k){return '<span><i style="background:'+cols[k]+'"></i>'+esc(l)+'</span>'}).join("")+'</div><div class="scroll" style="max-height:480px"><table><thead><tr><th>Statement</th><th>Dimension</th><th style="min-width:200px">Answers</th><th class="n" title="0 healthiest, 10 most growth needed. Reverse-scored items are flipped.">Growth need</th></tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr><td>'+esc(r.q.t)+(r.q.rig?' <span class="pill">rigidity</span>':'')+(r.q.k<0?' <span class="pill">reverse</span>':'')+'</td><td>'+esc(dimName(r.q.d))+'</td><td><div class="stk">'+
    r.c.map(function(v,k){return v?'<span style="width:'+pct(v,r.n)+'%;background:'+cols[k]+'" data-tip="'+esc(META.LIK[k]+": "+v+" ("+pct(v,r.n)+"%)")+'"></span>':''}).join("")+'</div></td><td class="n">'+fmt(r.avg,1)+'</td></tr>'});
  h+='</tbody></table></div>';
  var ch=META.CH.map(function(c,j){var i=META.PB.length+j,vals=R.map(function(r){return r.b[i]}).filter(function(v){return v!=null});
    var ok=c.chk==="att"?vals.filter(function(v){return v===c.want}).length:vals.filter(function(v){return v>=3}).length,txt=c.chk==="att"?"passed":"agreed";
    return '<tr><td>'+esc(c.t)+'</td><td>'+(c.chk==="att"?"Attention check":"Too good to be true")+'</td><td class="n">'+ok+' of '+vals.length+' '+txt+'</td></tr>'}).join("");
  return '<div class="card"><h2>Part B: statements</h2><p class="sub">Sorted by average growth need, highest first (where people struggle most).</p>'+h+
  '<h3 style="margin:14px 0 4px">Check items</h3><table><tbody>'+ch+'</tbody></table></div>';
}
function tableCard(R){
  var k=S.sort.k,dir=S.sort.dir,keyf={created:function(r){return r.t.getTime()},idx:function(r){return r.idx},band:function(r){return r.band},conf:function(r){return r.conf},dur:function(r){return r.dur==null?-1:r.dur},lang:function(r){return r.lang},rig:function(r){return r.rig}};
  if(META.DIMS.some(function(m){return m.id===k}))keyf[k]=function(r){return r.d[k].p==null?-1:r.d[k].p};
  var rows=R.slice().sort(function(a,b){var x=keyf[k](a),y=keyf[k](b);return (x>y?1:x<y?-1:0)*dir}),per=20,pages=Math.max(1,Math.ceil(rows.length/per));S.page=Math.min(S.page,pages-1);
  var th=function(key,label,cls){return '<th class="s '+(cls||"")+'" data-sort="'+key+'">'+label+(S.sort.k===key?(S.sort.dir<0?" ↓":" ↑"):"")+'</th>'};
  var h='<div class="scroll"><table><thead><tr>'+th("created","When")+th("lang","Lang")+th("idx","Index","n")+th("band","Tier")+th("conf","Confidence")+th("rig","Rigidity","n")+META.DIMS.map(function(m){return th(m.id,esc(m.n.slice(0,4)),"n")}).join("")+th("dur","Time","n")+'</tr></thead><tbody>';
  rows.slice(S.page*per,S.page*per+per).forEach(function(r){h+='<tr class="click" data-id="'+r.id+'"><td>'+r.t.toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+'</td><td>'+r.lang.toUpperCase()+'</td><td class="n"><b>'+r.idx+'</b></td><td><span class="pill">'+esc(r.band)+'</span></td><td>'+(r.conf==="Low"?'<span class="pill warn">Low</span>':esc(r.conf))+'</td><td class="n">'+r.rig+'%</td>'+
    META.DIMS.map(function(m){return '<td class="n">'+fmt(r.d[m.id].p)+'</td>'}).join("")+'<td class="n">'+(r.dur==null?"–":r.dur>=60?Math.round(r.dur/60)+"m":r.dur+"s")+'</td></tr>'});
  h+='</tbody></table></div><div class="top" style="margin:10px 0 0"><span class="mute">'+rows.length+' responses · page '+(S.page+1)+' of '+pages+'</span><span><button class="btn" id="pv"'+(S.page?'':' disabled')+'>Previous</button> <button class="btn" id="nx"'+(S.page<pages-1?'':' disabled')+'>Next</button> <button class="btn" id="csv">Export CSV</button></span></div>';
  return '<div class="card"><h2>All responses</h2><p class="sub">Click a column to sort, a row to see every answer. Dimension columns show strength %.</p>'+h+'</div>';
}

/* ---------- render ---------- */
function render(){
  var R=filtered(),DS=dimStats(R),SS=scenarioStats(R),h='';
  h+='<div class="top"><div class="brand"><h1>AVIRAL admin</h1><small>'+esc(session&&session.user?session.user.email:"")+'</small></div><div><button class="btn" id="rf">Refresh</button> <button class="btn" id="pr">Print</button> <button class="btn" id="so">Sign out</button></div></div>';
  h+='<div class="filters"><span class="mute">Period</span><span class="seg" id="sgR">'+[[7,"7 days"],[30,"30 days"],[90,"90 days"],[0,"All"]].map(function(x){return '<button data-v="'+x[0]+'" aria-pressed="'+(S.range===x[0])+'">'+x[1]+'</button>'}).join("")+'</span>'+
    '<span class="mute">Language</span><span class="seg" id="sgL">'+[["all","All"],["en","English"],["kn","Kannada"]].map(function(x){return '<button data-v="'+x[0]+'" aria-pressed="'+(S.lang===x[0])+'">'+x[1]+'</button>'}).join("")+'</span>'+
    '<label class="chk"><input type="checkbox" id="rel"'+(S.reliable?' checked':'')+'> Reliable only (hide low confidence)</label><span class="sp"></span><span class="mute">'+plural(R.length,"response")+' of '+ALL.length+'</span></div>';
  if(!ALL.length){h+='<div class="card empty">No responses yet. Complete the assessment once and it will appear here.</div>';$("root").innerHTML=h;wire();return}
  if(!R.length){h+='<div class="card empty">No responses match these filters.</div>';$("root").innerHTML=h;wire();return}
  h+=kpis(R);
  h+='<div class="card" style="margin-bottom:12px"><h2>What stands out</h2><p class="sub">Generated from the responses in this view</p>'+insights(R,DS,SS)+'</div>';
  h+='<div class="grid g2">'+tierCard(R)+histCard(R)+'</div>';
  h+='<div class="grid g21">'+dimCard(DS)+gapCard(DS)+'</div>';
  h+=timeCards(R);
  h+='<div class="grid g2">'+corrCard(R)+scatterCard(R)+'</div>';
  h+='<div class="grid g2">'+qualityCard(R)+'<div class="card"><h2>Languages and versions</h2><p class="sub">Which language and which question version people got</p>'+
     hbars([["English",R.filter(function(r){return r.lang==="en"}).length],["Kannada",R.filter(function(r){return r.lang==="kn"}).length],["Version 1 questions",R.filter(function(r){return r.variant===0}).length],["Version 2 questions",R.filter(function(r){return r.variant===1}).length]].map(function(x){return{label:x[0],v:x[1],text:x[1]+" · "+pct(x[1],R.length)+"%"}}),R.length)+'</div></div>';
  h+=scenarioCard(SS,R);
  h+='<div style="height:12px"></div>'+partBCard(R)+'<div style="height:12px"></div>'+tableCard(R);
  $("root").innerHTML=h;wire();
}
function wire(){
  var g=function(id){return $(id)};
  if(g("so"))g("so").onclick=signOut;
  if(g("rf"))g("rf").onclick=function(){load()};
  if(g("pr"))g("pr").onclick=function(){window.print()};
  [["sgR","range",Number],["sgL","lang",String]].forEach(function(c){var e=g(c[0]);if(!e)return;e.onclick=function(ev){var b=ev.target.closest("button");if(!b)return;S[c[1]]=c[2](b.getAttribute("data-v"));S.page=0;render()}});
  if(g("rel"))g("rel").onchange=function(){S.reliable=this.checked;S.page=0;render()};
  document.querySelectorAll("[data-scn]").forEach(function(tr){tr.onclick=function(){S.scn=+tr.getAttribute("data-scn");var y=scrollY;render();scrollTo(0,y)}});
  document.querySelectorAll("th[data-sort]").forEach(function(th){th.onclick=function(){var k=th.getAttribute("data-sort");S.sort=S.sort.k===k?{k:k,dir:-S.sort.dir}:{k:k,dir:-1};var y=scrollY;render();scrollTo(0,y)}});
  if(g("pv"))g("pv").onclick=function(){S.page--;var y=scrollY;render();scrollTo(0,y)};
  if(g("nx"))g("nx").onclick=function(){S.page++;var y=scrollY;render();scrollTo(0,y)};
  if(g("csv"))g("csv").onclick=exportCsv;
  document.querySelectorAll("tr[data-id]").forEach(function(tr){tr.onclick=function(){openDetail(tr.getAttribute("data-id"))}});
}

/* ---------- detail ---------- */
function openDetail(id){
  var r=ALL.filter(function(x){return x.id===id})[0];if(!r)return;
  var h='<div class="top"><div><h2>Response · '+r.t.toLocaleString()+'</h2><p class="sub">'+r.lang.toUpperCase()+' · version '+(r.variant+1)+' · '+(r.dur==null?"time unknown":r.dur+" s")+' · '+esc(r.shape||"")+'</p></div><button class="btn" id="dx">Close</button></div>';
  h+='<div class="grid g3"><div class="card kpi"><div class="v">'+r.idx+'</div><div class="l">Index · '+esc(r.band)+'</div></div><div class="card kpi"><div class="v">'+r.rig+'%</div><div class="l">Rigidity</div></div><div class="card kpi"><div class="v" style="font-size:20px">'+esc(r.conf)+'</div><div class="l">'+esc(CONF_WHY[r.why]||r.why||"")+'</div></div></div>';
  h+='<table><thead><tr><th>Dimension</th><th class="n">Overall</th><th class="n">Situations</th><th class="n">Statements</th></tr></thead><tbody>'+META.DIMS.map(function(m){var x=r.d[m.id];return '<tr><td>'+esc(m.n)+'</td><td class="n"><b>'+fmt(x.p)+'%</b></td><td class="n">'+fmt(x.a)+'%</td><td class="n">'+fmt(x.b)+'%</td></tr>'}).join("")+'</tbody></table>';
  h+='<h3 style="margin:14px 0 4px">Part A answers</h3>';
  META.PA.forEach(function(q,i){var oi=r.a[i];var v=q.v[r.variant%q.v.length],o=oi!=null&&oi>=0?v.o[oi]:null;h+='<div class="qa"><div class="q">'+esc(v.q)+'</div><div class="a">'+(o?esc(o[0]):"–")+(o?'<span class="chip">growth need '+o[1]+(o[2]?' · blunt':'')+'</span>':'')+'</div></div>'});
  h+='<h3 style="margin:14px 0 4px">Part B answers</h3>';
  META.PB.forEach(function(q,i){var v=r.b[i];h+='<div class="qa"><div class="q">'+esc(q.t)+'</div><div class="a">'+(v==null?"–":esc(META.LIK[v]))+'</div></div>'});
  META.CH.forEach(function(c,j){var v=r.b[META.PB.length+j];h+='<div class="qa"><div class="q">'+esc(c.t)+' <span class="pill">check</span></div><div class="a">'+(v==null?"–":esc(META.LIK[v]))+'</div></div>'});
  h+='<div class="top" style="margin-top:14px"><span class="mute">'+esc(r.id)+'</span><button class="btn danger" id="del">Delete this response</button></div>';
  $("panel").innerHTML=h;$("detail").classList.add("open");
  $("dx").onclick=closeDetail;
  var armed=false;$("del").onclick=function(){
    if(!armed){armed=true;this.textContent="Click again to delete permanently";return}
    sb.from("aviral_responses").delete().eq("id",id).then(function(x){if(x.error){$("del").textContent=x.error.message;return}ALL=ALL.filter(function(y){return y.id!==id});closeDetail();render()})};
}
function closeDetail(){$("detail").classList.remove("open")}
$("detail").addEventListener("click",function(e){if(e.target===this)closeDetail()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDetail()});

/* ---------- csv ---------- */
function exportCsv(){
  var R=filtered(),head=["created_at","lang","version","duration_s","index","tier","rigidity","confidence","confidence_reason"].concat(META.DIMS.map(function(m){return m.id+"_overall"}),META.DIMS.map(function(m){return m.id+"_partA"}),META.DIMS.map(function(m){return m.id+"_partB"}),
    META.PA.map(function(_,i){return "A"+(i+1)+"_option"}),META.PB.map(function(_,i){return "B"+(i+1)+"_level"}),META.CH.map(function(_,j){return "check"+(j+1)+"_level"}));
  var rows=R.map(function(r){return [r.t.toISOString(),r.lang,r.variant+1,r.dur,r.idx,r.band,r.rig,r.conf,r.why].concat(META.DIMS.map(function(m){return r.d[m.id].p}),META.DIMS.map(function(m){return r.d[m.id].a}),META.DIMS.map(function(m){return r.d[m.id].b}),
    META.PA.map(function(_,i){return r.a[i]==null?"":r.a[i]+1}),META.PB.map(function(_,i){return r.b[i]==null?"":r.b[i]}),META.CH.map(function(_,j){var v=r.b[META.PB.length+j];return v==null?"":v}))});
  var csv=[head].concat(rows).map(function(row){return row.map(function(c){c=c==null?"":String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="aviral_responses_"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();
}
boot();
</script>
</body>
</html>
