<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AVIRAL Admin</title>
<style>
:root{
  --bg:#f6f6f4;--surface:#fcfcfb;--ink:#1d1d1b;--ink2:#55554f;--muted:#7a7a72;--line:#e3e3de;--grid:#ececE7;
  --accent:#3f5fd0;--accent-ink:#fff;--warn:#b4560a;--danger:#b3261e;
  --s1:#3f5fd0;--s2:#11a7c9;--s3:#79a822;--s4:#d93a70;--s5:#ea9420;--s6:#8a54c9;
  --q1:#dbe3fa;--q2:#a9b9ee;--q3:#7b92e2;--q4:#516ed6;--q5:#2c47a8;
  --dvlo:#3f5fd0;--dvmid:#e7e7e2;--dvhi:#ea9420;--lv1:#2f8a4a;--lv2:#3f5fd0;--lv3:#d08a12;--lv4:#c8384a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121211;--surface:#1a1a19;--ink:#f0f0ec;--ink2:#c3c3bb;--muted:#8d8d85;--line:#2e2e2b;--grid:#272725;
  --accent:#6f86ee;--accent-ink:#0d0d0c;--warn:#e0a04a;--danger:#f2837c;
  --s1:#4d63dc;--s2:#0e9fa8;--s3:#6f9c1f;--s4:#e05080;--s5:#c87c14;--s6:#9a6ce0;
  --q1:#2a3463;--q2:#34479a;--q3:#4a63cc;--q4:#7389ea;--q5:#b4c1f8;
  --dvlo:#4d63dc;--dvmid:#33332f;--dvhi:#c87c14;--lv1:#4fae68;--lv2:#6f86ee;--lv3:#d9a03a;--lv4:#e5677a;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:20px}h2{font-size:15px}h3{font-size:13px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.brand small{color:var(--muted)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink2)}
.sp{flex:1}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{margin-bottom:2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:900px){.g6{grid-template-columns:repeat(3,1fr)}.g4,.g3{grid-template-columns:repeat(2,1fr)}.g2,.g21,.g12{grid-template-columns:1fr}}
@media(max-width:520px){.g6,.g4,.g3{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
.kpi .d{color:var(--ink2);font-size:12px;margin-top:4px}
.insights{margin:0;padding-left:18px;color:var(--ink2)}
.insights li{margin:3px 0}.insights b{color:var(--ink)}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;margin:5px 0}
.hb .lab{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{height:14px;background:var(--grid);border-radius:4px;position:relative;overflow:hidden}
.hb .bar{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hb .val{font-variant-numeric:tabular-nums;color:var(--ink);min-width:70px;text-align:right}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--muted);font:11px system-ui,sans-serif}
svg .ax{stroke:var(--line);stroke-width:1}svg .gr{stroke:var(--grid);stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink2);font-size:12.5px;margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--grid)}
.scroll{overflow:auto;max-height:520px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.stk{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.stk span{display:block;height:100%}
.hm{display:grid;gap:2px}
.hm div{display:flex;align-items:center;justify-content:center;min-height:34px;border-radius:4px;font-size:12px;color:#111;font-variant-numeric:tabular-nums}
.hm .h{background:transparent;color:var(--muted);font-size:11.5px;min-height:24px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;max-width:260px;opacity:0;transition:opacity .08s;white-space:pre-line}
.empty{color:var(--muted);padding:18px;text-align:center}
.login{max-width:420px;margin:12vh auto;padding:24px}
.login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:10px 0}
.msg{margin-top:10px;color:var(--ink2)}.msg.err{color:var(--danger)}
.detail{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;overflow:auto;padding:20px}
.detail.open{display:block}
.detail .panel{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.qa{border-top:1px solid var(--line);padding:8px 0}
.qa .q{color:var(--ink2)}.qa .a{font-weight:600}
.mute{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 12px}
.tabs a{padding:9px 14px;color:var(--ink2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:550}
.tabs a.on{color:var(--ink);border-color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.dotl{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pill.lg{font-size:13px;padding:3px 10px}
.rlist td{vertical-align:middle}.rlist .go{color:var(--accent);white-space:nowrap;font-size:12.5px}
.big{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0}
.big>b{font-size:56px;line-height:1;letter-spacing:-.03em}
.big>span:not(.pill){font-size:13px;color:var(--ink2)}
.gauge{position:relative;display:flex;height:12px;border-radius:6px;overflow:visible;gap:2px}
.gauge span{display:block;height:100%}.gauge span:first-child{border-radius:6px 0 0 6px}.gauge span:nth-child(3){border-radius:0 6px 6px 0}
.gauge b{position:absolute;top:-4px;width:4px;height:20px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.gl{display:grid;grid-template-columns:45fr 25fr 30fr;font-size:11.5px;color:var(--muted);margin-top:5px}
.kv td{padding:6px 4px}.kv tr:last-child td{border-bottom:0}
.note-low{border-color:var(--danger)}.note-mid{border-color:var(--warn)}
.dimr{padding:12px 0;border-top:1px solid var(--line)}
.dimh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.rk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--grid);font-size:11.5px;margin-right:8px;color:var(--ink2)}
.lvt{white-space:nowrap}
.trk2{position:relative;height:12px;background:var(--grid);border-radius:4px;margin:8px 0 6px}
.trk2 span{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.trk2 em{position:absolute;top:-3px;width:3px;height:18px;margin-left:-1.5px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--surface)}
.dims{font-size:12.5px;color:var(--ink2)}.mean{margin:6px 0 0;color:var(--ink2)}
.sw{padding:8px 0;border-top:1px solid var(--line)}.sw span{color:var(--ink2)}
.ul{margin:4px 0 0;padding-left:20px;color:var(--ink2)}.ul li{margin:4px 0}.ul b{color:var(--ink)}
.better{margin-top:3px;font-size:12.5px;color:var(--ink2)}

.tabs{margin:2px 0 10px}
details summary{cursor:pointer;color:var(--ink2)}
.opt-row{margin:6px 0}
.chip{font-size:11.5px;color:var(--muted);margin-left:6px}
@media print{.filters,.top .btn,.noprint{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>

<script>
var META={"DIMS":[{"id":"avabodha","n":"Avabodha","dv":"अवबोध","sub":"Insight & Clear Thinking","hi":"Alarming news, big decisions and other people's opinions cloud your judgement, and you can lose sight of what you actually think.","lo":"You see situations clearly, weigh evidence calmly and decide from your own judgement.","tips":["Before any big decision, write down the two strongest arguments against your first instinct.","When a worrying headline lands, wait a day and check one reliable source before acting."]},{"id":"vachana","n":"Vachana","dv":"वचन","sub":"Voice & Communication","hi":"Speaking up, disagreeing and taking criticism are hard, so your real view often goes unsaid.","lo":"You say what you think clearly and take feedback without losing your footing.","tips":["In your next meeting, state one view plainly, with one reason, before anyone asks.","When criticised, say “let me think about that” instead of defending or going silent."]},{"id":"indriyajaya","n":"Indriyajaya","dv":"इन्द्रियजय","sub":"Self-Mastery & Integrity","hi":"Under pressure your boundaries slip or your reactions run hot, and owning a mistake can feel too costly.","lo":"You stay composed, keep your word, own your mistakes and treat people with respect.","tips":["Practise one honest “I can't take that on” a week, without inventing an excuse.","When you feel the urge to snap back, pause one breath and name what bothered you instead."]},{"id":"ranjana","n":"Ranjana","dv":"रंजन","sub":"Influence & Trust","hi":"Pressure and louder voices sway you, and winning people's trust and support for your ideas does not come easily yet.","lo":"You hold your ground, earn people's trust and bring them with you.","tips":["Before asking for someone's support, find out what matters to them and show how your idea helps.","When your idea is passed over, restate it once, calmly, with the reason it matters."]},{"id":"abha","n":"Abha","dv":"आभा","sub":"Presence & Bearing","hi":"How you look and carry yourself takes up a lot of attention, and bends to other people's remarks.","lo":"You present yourself appropriately, then stop thinking about it once you are in the room.","tips":["Decide your outfit the night before, against the occasion, then stop checking.","Practise holding eye contact for a full sentence in everyday conversations."]},{"id":"lakshya","n":"Lakshya","dv":"लक्ष्य","sub":"Purposeful Growth","hi":"Setbacks and change knock you off course for a while, and learning new ways can feel like a threat rather than a step up.","lo":"You recover from setbacks, adapt to change and keep learning towards your goals.","tips":["After a setback, write down three things within your control before deciding anything.","Learn one small new skill each month, and tell someone what you learnt."]}],"PA":[{"d":"avabodha","src":"Original A2","v":[{"q":"You read in the media that a new disease is spreading in your area. You:","o":[["Think, thank God I haven't caught it, and carry on.",2.25,0],["Feel you may already have some of its symptoms.",9.25,0],["Start recalling that a friend of yours has had symptoms.",4.25,0],["Decide to visit a doctor and get examined, though you feel fine.",4.25,0],["Check a reliable source, and take sensible precautions if needed.",0,0]]},{"q":"A report says a product you use every day may carry a health risk. You:","o":[["Look at the evidence, and change the habit only if it holds up.",0,0],["Note it and carry on as usual.",2.5,0],["Keep searching for more about it, and feel uneasy.",6.25,0],["Become convinced it has already harmed you.",9.25,0]]}]},{"d":"lakshya","src":"New (locus of control)","v":[{"q":"Something you worked hard on fails. You:","o":[["Look at what you would do differently next time.",0,0],["Review it, accepting part of it was outside your hands.",1.25,0],["Conclude the circumstances were stacked against you.",6.25,0],["Feel it proves things rarely go your way, whatever you do.",9.25,0]]},{"q":"An opportunity you wanted goes to someone else. You:","o":[["Ask what you could strengthen for the next one.",0,0],["Accept that some of it was yours to control and some was not.",1.25,0],["Assume it was decided by connections, not merit.",5.5,0],["Take it as proof that outcomes are not yours to influence.",9.5,0]]}]},{"d":"vachana","src":"Original A6","v":[{"q":"A person you know keeps holding forth on politics, the economy and cinema, with opinions you don't agree with. You:","o":[["Feel it may hurt them, so you just say “oh, ha” and nod.",7.75,0],["Pretend you're not interested in the topics, and stay quiet.",6,0],["Diplomatically convey that you don't agree with their opinions.",0,0],["Tell them to their face that their opinions are wrong.",6.25,1]]},{"q":"A relative repeats claims at a family gathering that you believe are plainly wrong. You:","o":[["Set out calmly where you see it differently.",0,0],["Tell them flatly, in front of everyone, that they are mistaken.",6.5,1],["Let it go and change the subject.",4.25,0],["Agree outwardly to keep the peace.",7.75,0]]}]},{"d":"vachana","src":"New (from original B13)","v":[{"q":"You are asked for your honest view in a group that clearly thinks otherwise. You:","o":[["Give it plainly, with your reasons.",0,0],["Give it, but wrap it very carefully.",2,0],["Give a vague, neutral answer instead.",6,0],["Agree with the room; your real view would not go down well.",9.5,0]]},{"q":"You hold an opinion you know the people around you would disagree with. When it becomes relevant, you:","o":[["Say it clearly and calmly.",0,0],["Say it, but soften it until it barely registers.",4,0],["Keep it to yourself; it isn't worth the reaction.",5.25,0],["Hide it; if they knew, they would think less of you.",9.25,0]]}]},{"d":"indriyajaya","src":"Original A3","v":[{"q":"A colleague in your office asks you to help with their task. You:","o":[["Accept it, because you can't bring yourself to reject their request.",8.5,0],["Agree, on the condition that they help you in future.",2.75,0],["Refuse, giving some lame excuse.",6.5,0],["Explain honestly why you can't help this time.",0.25,0]]},{"q":"A neighbour asks for help that will take most of your Sunday. You had plans. You:","o":[["Tell them honestly you're not free, and offer another time.",0,0],["Tell them it's not your problem.",6.75,1],["Say you'll try, then find a reason not to turn up.",7,0],["Cancel your plans rather than let them down.",7.25,0]]}]},{"d":"indriyajaya","src":"Original A4","v":[{"q":"Your parents tell you they are attending a relative's function the day after tomorrow, and that you have no choice but to come along. You:","o":[["Go along with it without checking your own plans.",4,0],["Reply curtly that you have very important work and can't go.",6,1],["Say casually you'll try your best, and join if possible.",5,0],["Say yes, then give some reason later and escape.",7.75,0],["Check your own plans, and tell them honestly whether you can come.",0.25,0]]},{"q":"Your manager announces you'll be staying late for a client event, without asking whether you're free. You:","o":[["Say plainly whether you can, and what you'd need to make it work.",0,0],["Refuse curtly in front of the team.",6.5,1],["Agree, then quietly slip away early.",7.75,0],["Cancel your own commitments without a word.",7.75,0]]}]},{"d":"abha","src":"Original A1","v":[{"q":"You buy something trending: a shirt, a hat, a watch. A friend says it's nice, but it doesn't suit you. You:","o":[["Reply sarcastically that they just can't stand seeing you comfortable.",5.5,1],["Check with others whether it suits you.",4.75,0],["Don't take it too seriously; you chose it for yourself.",0,0],["Go back to the shop and exchange it for another colour or design.",7.75,0]]},{"q":"A colleague remarks that your outfit is too casual for an important meeting. You:","o":[["Consider whether they have a point, and decide for next time yourself.",0,0],["Tell them your clothes are none of their business.",6,1],["Feel self-conscious through the rest of the meeting.",6.25,0],["Rush to borrow or buy something else before the meeting.",6.75,0]]}]},{"d":"abha","src":"Original A7","v":[{"q":"At the salon for a haircut, the owner looks at your hair and says it looks bad, and that you must come more often or you will look unattractive. You:","o":[["Recognise it as a sales pitch to grow their business.",0,0],["Get worried about your looks, and take their advice seriously.",9,0],["Gently tell them that it's not so.",1,0],["Tell them directly they shouldn't insult customers to grow their business.",4.25,1]]},{"q":"A stylist tells you your look is outdated, and that you'd be taken more seriously after a complete makeover. You:","o":[["Weigh it as one opinion, and change only what you agree with.",0,0],["Tell them sharply they have no idea what they're talking about.",6,1],["Start doubting how people at work see you.",6.75,0],["Book the full makeover on the spot.",8.75,0]]}]},{"d":"ranjana","src":"Original A5","v":[{"q":"At a brand showroom, the salesperson brings you a shirt, praises its quality and design, says it suits you well, and keeps pressing you to buy. You:","o":[["See it as the usual tactic, and ask to see a different shirt.",0,0],["Tell them you know exactly what you want, and feel irritated.",3.25,1],["Trust that they know quality and design, and buy that shirt.",9,0],["Appreciate their communication skills with a smile, but don't buy it.",0,0]]},{"q":"A friend who is very confident about money urges you into an investment you hadn't planned. You:","o":[["Say you'll look into it yourself before deciding.",0,0],["Tell them to stop pushing their schemes on you.",5.25,1],["Put in a small amount so you don't seem doubtful.",6.75,0],["Invest on their say-so.",9.75,0]]}]},{"d":"ranjana","src":"New (impact)","v":[{"q":"You make a suggestion in a meeting and it is passed over. Later someone else makes the same point, and it is welcomed. You:","o":[["Point out calmly that it builds on what you raised, and add to it.",0,0],["Call it out sharply as your idea.",5.5,1],["Let it go; at least it's being done.",5.75,0],["Conclude that your ideas don't carry weight here.",8.75,0]]},{"q":"Your team must choose between your plan and a colleague's. Theirs is pushed louder; you believe yours is better. You:","o":[["Set out clearly why yours works, then let the team decide.",0,0],["Dismiss their plan as obviously weaker.",6,1],["Mention yours briefly, then go along with theirs.",6,0],["Withdraw yours before it is even discussed.",9.5,0]]}]},{"d":"avabodha","src":"New (decision-making)","v":[{"q":"You face a decision that matters, with no obvious right answer. You:","o":[["Weigh it against what matters most to you, and decide.",0,0],["Take one or two trusted views, then decide yourself.",0.75,0],["Keep asking more people; each view shifts you.",6,0],["Put it off until someone decides for you.",9,0]]},{"q":"Two good options, and no clear winner between them. You:","o":[["Decide by which one fits what you care about.",0,0],["Sound out one person, then choose.",0.75,0],["Collect many opinions, and swing with each.",6,0],["Delay until the choice is made for you.",9,0]]}]},{"d":"lakshya","src":"New (adaptability)","v":[{"q":"Your workplace switches to a new system you have never used. You:","o":[["Dive in and learn it properly.",0,0],["Learn what you need, and ask for help where you're stuck.",0.5,0],["Stick to the old way for as long as you can.",6,0],["Feel it's beyond you, and avoid it.",8.5,0]]},{"q":"You learn that a skill you are proud of is becoming outdated. You:","o":[["Plan how to update it, and start.",0,0],["Pick up the essentials of the newer approach.",1,0],["Insist your way still works better.",5.75,1],["Feel you've fallen behind for good.",8.75,0]]}]},{"d":"indriyajaya","src":"New (integrity)","v":[{"q":"You discover a mistake in your work that nobody else has noticed yet. You:","o":[["Tell the people affected, and fix it.",0,0],["Fix it quietly without mentioning it.",2.75,0],["Wait to see whether anyone notices.",6.75,0],["If it comes up, put it down to someone else's input.",9.75,0]]},{"q":"Your manager praises work that a teammate mostly did. You:","o":[["Say on the spot that it was mainly your teammate's work.",0,0],["Mention your teammate's part to the manager later.",1.75,0],["Accept the praise and say nothing.",6.75,0],["Present it as your own work.",10,0]]}]},{"d":"ranjana","src":"New (earning trust)","v":[{"q":"You need support for your project from a senior colleague who barely knows you. You:","o":[["Learn what matters to them, and show how the project helps.",0,0],["Send a detailed proposal by email, and wait.",3.25,0],["Ask your own boss to pressure them into it.",5.75,0],["Drop the idea of their support, and manage without.",8,0]]},{"q":"Two people in your team are in a conflict that is slowing everyone down. You:","o":[["Talk to both, and help them find common ground.",0,0],["Raise it with your manager straight away.",3.75,0],["Side with the person you agree with.",6,1],["Stay out of it, and hope it settles.",6.75,0]]}]}],"PB":[{"d":"avabodha","k":1,"rig":0,"src":"Original B13","t":"If others knew my real thoughts, I feel they would be disgusted."},{"d":"lakshya","k":1,"rig":0,"src":"Original B15","t":"When I am emotionally upset, I feel hopeless."},{"d":"vachana","k":1,"rig":0,"src":"Original B5","t":"I get really worked up when someone comments critically on me."},{"d":"vachana","k":1,"rig":0,"src":"Original B11","t":"I feel miserable saying “no” or “not possible” to someone."},{"d":"indriyajaya","k":1,"rig":1,"src":"Original B7","t":"I feel disgusted when I meet people I find eccentric, odd or foolish."},{"d":"indriyajaya","k":1,"rig":1,"src":"Original B8","t":"If someone hurts me, I immediately hurt them back."},{"d":"abha","k":-1,"rig":0,"src":"New","t":"I feel at ease with how I come across in professional settings."},{"d":"abha","k":-1,"rig":0,"src":"New","t":"I hold eye contact comfortably when speaking with someone."},{   h+='<div class="top noprint"><a class="btn" href="#">← All responses</a><span><button class="btn" id="rpr">Print / Save PDF</button> <button class="btn danger" id="del">Delete</button></span></div>';
  /* score */
  var gauge='<div class="gauge"><span style="width:45%;background:color-mix(in srgb,var(--s5) 22%,transparent)"></span><span style="width:25%;background:color-mix(in srgb,var(--s2) 22%,transparent)"></span><span style="width:30%;background:color-mix(in srgb,var(--s3) 22%,transparent)"></span><b style="left:'+r.idx+'%"></b></div><div class="gl"><span>Emerging</span><span>Established</span><span>Exemplary</span></div>';
  h+='<div class="grid g21"><div class="card"><p class="sub" style="margin:0">AVIRAL™ report · '+esc(r.t.toLocaleString(undefined,{weekday:"short",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}))+'</p>'+
     '<div class="big"><b>'+r.idx+'</b><span>AVIRAL Index, out of 100<br><span class="mute">likely range '+Math.max(0,r.idx-7)+'–'+Math.min(100,r.idx+7)+'</span></span><span class="pill lg"><i class="dot" style="background:'+BAND_COL[r.band]+'"></i>'+esc(r.band)+'</span></div>'+
     '<p style="margin:4px 0 10px;color:var(--ink2)">'+esc(bi.tag)+'.</p>'+gauge+
     (idxBeat!=null?'<p class="sub" style="margin:10px 0 0">Higher than '+idxBeat+'% of all '+ALL.length+' respondents.</p>':'')+'</div>'+
     '<div class="card"><h3 style="margin-bottom:8px">About this response</h3><table class="kv"><tbody>'+
     [["Language",r.lang==="kn"?"Kannada":"English"],["Question version",String(r.variant+1)],["Time taken",durTxt(r.dur)],["Confidence",r.conf+(r.conf!=="Good"&&CONF_WHY[r.why]?" · "+CONF_WHY[r.why]:"")],["Profile shape",(r.shape||"–")+" · "+r.spread+" pt spread"],["Rigidity",r.rig+"%"+(r.rig>=50?" · high":r.rig>=30?" · moderate":" · low")]].map(function(x){return '<tr><td class="mute">'+x[0]+'</td><td>'+esc(x[1])+'</td></tr>'}).join("")+'</tbody></table></div></div>';
  if(r.conf!=="Good")h+='<div class="card note-'+(r.conf==="Low"?"low":"mid")+'" style="margin-bottom:12px"><b>Read with care: '+esc(r.conf.toLowerCase())+' confidence.</b> '+esc(({att:"One or both attention checks were answered wrongly, so some answers may not reflect real views.",rushed:"The assessment was completed in under 2 minutes, which is too fast to read every question.",same:"The same answer was given almost everywhere.",sd:"Several “too good to be true” statements were agreed with, so answers may lean towards how the person would like to be seen.",neutral:"Many statements were answered Neutral, which blurs the profile.",flat:"Answers were so uniform that dimensions cannot be told apart well."})[r.why]||"")+'</div>';
  /* tier meaning */
  h+='<div class="card" style="margin-bottom:12px"><h2>What the '+esc(r.band)+' tier means</h2><p class="sub">The interpretation the respondent saw with their result</p>'+bi.p.map(function(x){return '<p style="margin:0 0 8px">'+esc(x)+'</p>'}).join("")+'</div>';
  /* dimension performance */
  h+='<div class="card" style="margin-bottom:12px"><h2>Performance on each dimension</h2><p class="sub">Strongest first. The bar is this person; the thin mark is the average of all respondents. Situations (Part A) is what they would do; statements (Part B) is how they see themselves.</p>'+
     '<div class="legend"><span>Bar: this person</span><span><i style="background:var(--ink);width:3px"></i>Average of everyone</span>'+META.LEVELS.map(function(l){return '<span><i class="dotl" style="background:'+LV_COL[l.n]+'"></i>'+l.n+(l.min?' '+l.min+'+':' under 40')+'</span>'}).join("")+'</div>';
  ranked.forEach(function(x,i){
    h+='<div class="dimr"><div class="dimh"><span><span class="rk">'+(i+1)+'</span><b>'+esc(x.m.n)+'</b> <span class="mute">'+esc(x.m.dv)+' · '+esc(x.m.sub)+'</span></span><span class="lvt"><i class="dotl" style="background:'+LV_COL[x.lv.n]+'"></i>'+x.lv.n+' · <b>'+x.p+'%</b></span></div>'+
       '<div class="trk2"><span style="width:'+x.p+'%;background:'+DIMCOL[x.m.id]+'"></span>'+(x.avg!=null?'<em style="left:'+x.avg+'%" data-tip="Average of all respondents: '+fmt(x.avg)+'%"></em>':'')+'</div>'+
       '<div class="dims">Situations <b>'+fmt(x.a)+'%</b> · Statements <b>'+fmt(x.b)+'%</b>'+(x.avg!=null?' · Average '+fmt(x.avg)+'%':'')+(x.beat!=null?' · Higher than '+x.beat+'% of respondents':'')+'</div>'+
       '<p class="mean">'+esc(x.p<60?x.m.hi:x.m.lo)+'</p></div>';
  });
  h+='</div>';
  /* strengths and improvement */
  h+='<div class="grid g2"><div class="card"><h2>Strengths</h2><p class="sub">The two highest-scoring dimensions, and what this tier usually does well</p>'+
     strong.map(function(x){return '<div class="sw"><b>'+esc(x.m.n)+'</b> · '+x.p+'%<br><span>'+esc(x.p>=60?x.m.lo:"Stronger than their other areas, though still in the developing range.")+'</span></div>'}).join("")+
     '<h3 style="margin:12px 0 4px">Strengths to keep</h3>'+ul(bi.s)+'</div>'+
     '<div class="card"><h2>Areas of improvement</h2><p class="sub">The two lowest-scoring dimensions, with what to work on</p>'+
     weak.map(function(x){return '<div class="sw"><b>'+esc(x.m.n)+'</b> · '+x.p+'% · '+x.lv.n+'<br><span>'+esc(x.p<60?x.m.hi:"Still in the steady range, so this is refinement rather than repair.")+'</span></div>'}).join("")+
     '<h3 style="margin:12px 0 4px">Watch-outs</h3>'+ul(bi.w)+'</div></div>';
  /* plan */
  h+='<div class="card" style="margin-bottom:12px"><h2>30-day practice plan</h2><p class="sub">Focused on '+esc(weak[0].m.n)+' and '+esc(weak[1].m.n)+'</p><ol class="ul">'+
     weak.reduce(function(a,x){return a.concat(x.m.tips.map(function(t){return '<li><b>'+esc(x.m.n)+':</b> '+esc(t)+'</li>'}))},[]).join("")+'</ol></div>';
  /* say vs do */
  var gaps=rows.filter(function(x){return x.a!=null&&x.b!=null&&Math.abs(x.a-x.b)>=20}).sort(function(p,q){return Math.abs(q.a-q.b)-Math.abs(p.a-p.b)});
  h+='<div class="card" style="margin-bottom:12px"><h2>Say versus do</h2><p class="sub">Dimensions where what they would do (situations) and how they see themselves (statements) differ by 20 points or more</p>'+
     (gaps.length?'<ul class="ul">'+gaps.map(function(x){return '<li><b>'+esc(x.m.n)+'</b>: situations '+x.a+'%, statements '+x.b+'%. '+(x.a<x.b?"In real situations they act less steadily than they see themselves.":"They handle this better than they give themselves credit for.")+'</li>'}).join("")+'</ul>':'<p class="mute" style="margin:0">No large gaps. What they say and what they would do line up well.</p>')+'</div>';
  /* answers that pulled the score down */
  var drag=[];
  META.PA.forEach(function(q,i){var oi=r.a[i];if(oi==null||oi<0)return;var v=q.v[r.variant%q.v.length],o=v.o[oi];if(!o||o[1]<4)return;
    var best=v.o.filter(function(z){return z[1]===Math.min.apply(null,v.o.map(function(w){return w[1]}))})[0];
    drag.push({d:q.d,g:o[1],h:'<div class="qa"><div class="q"><span class="pill">'+esc(dimName(q.d))+'</span> '+esc(v.q)+'</div><div class="a">Chose: '+esc(o[0])+'<span class="chip">growth need '+o[1]+(o[2]?' · blunt':'')+'</span></div><div class="better">A steadier response: '+esc(best[0])+'</div></div>'})});
  META.PB.forEach(function(q,i){var v=r.b[i];if(v==null)return;var g=q.k>0?v*2.5:(4-v)*2.5;if(g<7.5)return;
    drag.push({d:q.d,g:g,h:'<div class="qa"><div class="q"><span class="pill">'+esc(dimName(q.d))+'</span> '+esc(q.t)+'</div><div class="a">Answered: '+esc(META.LIK[v])+'<span class="chip">growth need '+g+'</span></div></div>'})});
  drag.sort(function(a,b){return b.g-a.g});
  h+='<div class="card" style="margin-bottom:12px"><h2>Answers that pulled the score down</h2><p class="sub">Specific answers with a high growth need (0 is the healthiest answer, 10 the most room to grow). These are the most concrete places to start coaching.</p>'+
     (drag.length?drag.map(function(x){return x.h}).join(""):'<p class="mute" style="margin:0">No answers with a high growth need.</p>')+'</div>';
  /* all answers */
  h+='<div class="card" style="margin-bottom:12px"><details><summary><b>All answers</b> (14 situations, 18 statements)</summary>';
  META.DIMS.forEach(function(m){
    h+='<h3 style="margin:14px 0 2px;color:var(--ink)">'+esc(m.n)+' <span class="mute" style="font-weight:400">· '+esc(m.sub)+'</span></h3>';
    META.PA.forEach(function(q,i){if(q.d!==m.id)return;var oi=r.a[i],v=q.v[r.variant%q.v.length],o=oi!=null&&oi>=0?v.o[oi]:null;h+='<div class="qa"><div class="q">'+esc(v.q)+'</div><div class="a">'+(o?esc(o[0])+'<span class="chip">growth need '+o[1]+(o[2]?' · blunt':'')+'</span>':'–')+'</div></div>'});
    META.PB.forEach(function(q,i){if(q.d!==m.id)return;var v=r.b[i];h+='<div class="qa"><div class="q">'+esc(q.t)+(q.k<0?' <span class="pill">reverse</span>':'')+'</div><div class="a">'+(v==null?"–":esc(META.LIK[v])+'<span class="chip">growth need '+(q.k>0?v*2.5:(4-v)*2.5)+'</span>')+'</div></div>'});
  });
  h+='<h3 style="margin:14px 0 2px">Check items (not scored)</h3>';
  META.CH.forEach(function(c,j){var v=r.b[META.PB.length+j],ok=v==null?null:c.chk==="att"?v===c.want:v<3;h+='<div class="qa"><div class="q">'+esc(c.t)+' <span class="pill">'+(c.chk==="att"?"attention check":"too good to be true")+'</span></div><div class="a">'+(v==null?"–":esc(META.LIK[v]))+(ok==null?'':'<span class="chip">'+(c.chk==="att"?(ok?"passed":"missed"):(ok?"realistic":"idealised"))+'</span>')+'</div></div>'});
  h+='</details></div>';
  h+='<p class="sub">Response ID '+esc(r.id)+'. AVIRAL is a self-reflection tool, not a clinical or diagnostic instrument.</p>';
  return h;
}
function wireReport(r){
  $("rpr").onclick=function(){var d=document.querySelector("details");if(d)d.open=true;window.print()};
  var armed=false;$("del").onclick=function(){
    var b=this;if(!armed){armed=true;b.textContent="Click again to delete permanently";return}
    b.disabled=true;b.textContent="Deleting…";
    sb.from("aviral_responses").delete().eq("id",r.id).then(function(x){if(x.error){b.disabled=false;b.textContent=x.error.message;return}ALL=ALL.filter(function(y){return y.id!==r.id});location.hash=""})};
}

/* ---------- csv ---------- */
function exportCsv(){
  var R=filtered(),head=["created_at","lang","version","duration_s","index","tier","rigidity","confidence","confidence_reason"].concat(META.DIMS.map(function(m){return m.id+"_overall"}),META.DIMS.map(function(m){return m.id+"_partA"}),META.DIMS.map(function(m){return m.id+"_partB"}),
    META.PA.map(function(_,i){return "A"+(i+1)+"_option"}),META.PB.map(function(_,i){return "B"+(i+1)+"_level"}),META.CH.map(function(_,j){return "check"+(j+1)+"_level"}));
  var rows=R.map(function(r){return [r.t.toISOString(),r.lang,r.variant+1,r.dur,r.idx,r.band,r.rig,r.conf,r.why].concat(META.DIMS.map(function(m){return r.d[m.id].p}),META.DIMS.map(function(m){return r.d[m.id].a}),META.DIMS.map(function(m){return r.d[m.id].b}),
    META.PA.map(function(_,i){return r.a[i]==null?"":r.a[i]+1}),META.PB.map(function(_,i){return r.b[i]==null?"":r.b[i]}),META.CH.map(function(_,j){var v=r.b[META.PB.length+j];return v==null?"":v}))});
  var csv=[head].concat(rows).map(function(row){return row.map(function(c){c=c==null?"":String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="aviral_responses_"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();
}
boot();
</script>
