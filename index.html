<style>
:root{--bg:#faf7f1;--card:#fff;--ink:#1f2933;--mute:#5f6b76;--line:#dde2ea;--acc:#1c2f66;--acc-ink:#fff;--warn:#b42318;--sel:#eaf0f9;
--b1:#c2410c;--b2:#b7791f;--b3:#0f766e;--b4:#6d28d9;--lv1:#0f766e;--lv2:#4d7c0f;--lv3:#b7791f;--lv4:#c2410c;
--s1:#3f5fd0;--s2:#11a7c9;--s3:#79a822;--s4:#d93a70;--s5:#ea9420;--s6:#8a54c9;--gold:#b07d1f;--grid:#e1e0d9}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1d2328;--ink:#e8ecef;--mute:#9aa6b0;--line:#2e373e;--acc:#a3b5ee;--acc-ink:#0b1730;--warn:#f87171;--sel:#1a2a44;
--b1:#fb923c;--b2:#fbbf24;--b3:#2dd4bf;--b4:#a78bfa;--lv1:#2dd4bf;--lv2:#a3e635;--lv3:#fbbf24;--lv4:#fb923c;
--s1:#4d63dc;--s2:#0e9fa8;--s3:#6f9c1f;--s4:#e05080;--s5:#c87c14;--s6:#9a6ce0;--gold:#e3b04b;--grid:#2c2c2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.4rem}h3{font-size:1.1rem}
p{margin:0 0 .9em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.mute{color:var(--mute)}.small{font-size:.88rem}
.prog{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:5}
.prog .row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.part{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
fieldset{border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px;background:var(--card)}
fieldset.missing{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 25%,transparent)}
legend{padding:0;float:left;width:100%;font-weight:600;margin-bottom:12px}
legend+*{clear:both}
.qn{color:var(--acc);font-weight:700;margin-right:6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;margin-top:8px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--mute)}
.opt:has(input:checked){background:var(--sel);border-color:var(--acc)}
.opt:has(input:checked) .k{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.opt:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk .opt{margin:0;padding:9px 4px;justify-content:center;text-align:center;font-size:.8rem;line-height:1.25;min-height:52px;align-items:center}
.btns{display:flex;gap:10px;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:10px;padding:11px 20px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.msg{color:var(--warn);font-weight:600;min-height:1.4em;margin:4px 0}
input[type=text]{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
ul{margin:.2em 0 .9em;padding-left:1.2em}li{margin-bottom:.3em}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font:700 3.2rem/1 Georgia,serif}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;font-size:.9rem;border:1.5px solid currentColor}
.gauge{position:relative;display:flex;gap:2px;height:16px;border-radius:99px;overflow:hidden;margin:26px 0 4px}
.gauge i{display:block;height:100%}
.mk{position:absolute;top:-6px;width:4px;height:28px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.ticks{position:relative;height:34px;font-size:.73rem;color:var(--mute)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.split{grid-template-columns:1fr}h1{font-size:1.65rem}}
.th{margin-bottom:16px}
.th .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.95rem;margin-bottom:4px}
.th .nm{font-weight:600}
.th .wt{font-size:.78rem;color:var(--mute);font-weight:400;white-space:nowrap}
.th .rt{font-size:.82rem;font-weight:700;white-space:nowrap;flex:none}
.th .meaning{font-size:.84rem;color:var(--mute);margin-top:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;margin:4px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.note{border-left:4px solid var(--acc);padding:9px 14px;background:var(--sel);border-radius:0 10px 10px 0;margin:0 0 12px;font-size:.94rem}
.note.flag{border-left-color:var(--warn)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-weight:600;color:var(--mute);font-size:.8rem}
table.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
details summary{cursor:pointer;font-weight:600}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.brand h1{margin:0;letter-spacing:.06em;color:var(--acc);font-family:Cinzel,Georgia,serif;font-weight:700;font-size:2.3rem}
.dvn{font-family:"Noto Serif Devanagari","Kohinoor Devanagari","Nirmala UI",serif;font-weight:600;color:var(--gold)}
.acr b{color:var(--gold)}
.rr{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.rr:last-of-type{border-bottom:0}
.rk{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:#fff}
.rb{flex:1;min-width:0}
.rb .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.rb .nm{font-weight:700}
.rb .meaning{font-size:.86rem;color:var(--mute);margin-top:5px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:600px){.sumgrid{grid-template-columns:1fr}}
.sumbox{border:1px solid var(--line);border-radius:12px;padding:14px}
.sumbox h3{margin-bottom:8px}
.sumbox p{font-size:.92rem;margin-bottom:8px}
.brand .sub{margin:2px 0 0;font-weight:600}
.tagline{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:center;border-top:1px solid var(--line);padding-top:12px;margin:16px 0 0}
html[lang="kn"] .tagline{letter-spacing:.02em;text-transform:none;font-size:.85rem}
.lang{display:flex;justify-content:flex-end;gap:6px;margin:0 0 10px}
.lang button{padding:6px 14px;font-size:.88rem;border-radius:99px}
.lang button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.lang button[lang="kn"],html[lang="kn"] body{font-family:"Noto Sans Kannada","Kannada Sangam MN","Nirmala UI","Tunga",ui-sans-serif,system-ui,sans-serif}
html[lang="kn"] body{line-height:1.7}
html[lang="kn"] h1,html[lang="kn"] h2,html[lang="kn"] h3{font-family:"Noto Serif Kannada","Noto Sans Kannada","Kannada Sangam MN","Nirmala UI",Georgia,serif;line-height:1.4}
html[lang="kn"] h1{font-size:1.7rem}
html[lang="kn"] .part{letter-spacing:0;text-transform:none;font-size:.85rem}
html[lang="kn"] .lk .opt{font-size:.78rem}
@media(max-width:520px){html[lang="kn"] .lk{grid-template-columns:1fr}html[lang="kn"] .lk .opt{min-height:0;justify-content:flex-start;text-align:left;font-size:.92rem;padding:9px 12px}}
@media print{.prog,.btns,.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid}details{display:block}}
</style>
</head>

var DIMS=[
 {id:"avabodha",n:"Avabodha",dv:"अवबोध",sub:"Insight & Clear Thinking",w:100/6,c:"var(--s1)",
  hi:"Alarming news, big decisions and other people's opinions cloud your judgement, and you can lose sight of what you actually think.",

 {id:"ranjana",n:"Ranjana",dv:"रंजन",sub:"Influence & Trust",w:100/6,c:"var(--s4)",

 {id:"abha",n:"Abha",dv:"आभा",sub:"Presence & Bearing",w:100/6,c:"var(--s5)",

{d:"avabodha",w:1,src:"Original A2",v:[

 {q:"A neighbour asks for help that will take most of your Sunday. You had plans. You:",o:[

{d:"indriyajaya",w:1,src:"Original A4",v:[

{d:"abha",w:1,src:"Original A1",v:[
 {q:"You buy something trending: a shirt, a hat, a watch. A friend says it's nice, but it doesn't suit you. You:",o:[

 {q:"A colleague remarks that your outfit is too casual for an important meeting. You:",o:[

{d:"abha",w:1,src:"Original A7",v:[

{d:"ranjana",w:1,src:"Original A5",v:[

 {q:"A friend who is very confident about money urges you into an investment you hadn't planned. You:",o:[

{d:"ranjana",w:1,src:"New (impact)",v:[

{d:"ranjana",w:1,src:"New (earning trust)",v:[

var PB=[

"Take one or two trusted views, then decide yourself.":"ನಂಬಿಕಸ್ಥ ಒಬ್ಬಿಬ್ಬರ ಅಭಿಪ್ರಾಯ ಪಡೆದು, ನಂತರ ನೀವೇ ನಿರ್ಧರಿಸುತ್ತೀರಿ.",
"Keep asking more people; each view shifts you.":"ಇನ್ನಷ್ಟು ಜನರನ್ನು ಕೇಳುತ್ತಲೇ ಇರುತ್ತೀರಿ; ಪ್ರತಿ ಅಭಿಪ್ರಾಯವೂ ನಿಮ್ಮನ್ನು ಅಲುಗಾಡಿಸುತ್ತದೆ.",
"Put it off until someone decides for you.":"ಬೇರೆ ಯಾರಾದರೂ ನಿರ್ಧರಿಸುವವರೆಗೆ ಮುಂದೂಡುತ್ತೀರಿ.",
"Two good options, and no clear winner between them. You:":"ಎರಡು ಉತ್ತಮ ಆಯ್ಕೆಗಳಿವೆ, ಅವುಗಳಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಯಾವುದೂ ಮೇಲಲ್ಲ. ನೀವು:",
"Decide by which one fits what you care about.":"ನೀವು ಮಹತ್ವ ನೀಡುವ ವಿಷಯಗಳಿಗೆ ಯಾವುದು ಹೊಂದುತ್ತದೆಯೋ ಅದನ್ನು ಆರಿಸುತ್ತೀರಿ.",
"Sound out one person, then choose.":"ಒಬ್ಬರ ಅಭಿಪ್ರಾಯ ಕೇಳಿ, ನಂತರ ಆರಿಸುತ್ತೀರಿ.",
"Collect many opinions, and swing with each.":"ಹಲವು ಅಭಿಪ್ರಾಯಗಳನ್ನು ಸಂಗ್ರಹಿಸಿ, ಪ್ರತಿಯೊಂದರ ಜೊತೆಗೂ ವಾಲುತ್ತೀರಿ.",
"Delay until the choice is made for you.":"ಆಯ್ಕೆ ಬೇರೆಯವರಿಂದಲೇ ಆಗುವವರೆಗೆ ತಡಮಾಡುತ್ತೀರಿ.",
"Your workplace switches to a new system you have never used. You:":"ನಿಮ್ಮ ಕೆಲಸದ ಸ್ಥಳದಲ್ಲಿ ನೀವು ಎಂದೂ ಬಳಸದ ಹೊಸ ವ್ಯವಸ್ಥೆಯನ್ನು ಜಾರಿಗೆ ತರಲಾಗುತ್ತದೆ. ನೀವು:",
"Dive in and learn it properly.":"ಆಸಕ್ತಿಯಿಂದ ತೊಡಗಿಸಿಕೊಂಡು ಅದನ್ನು ಸರಿಯಾಗಿ ಕಲಿಯುತ್ತೀರಿ.",
"Learn what you need, and ask for help where you're stuck.":"ನಿಮಗೆ ಬೇಕಾದಷ್ಟು ಕಲಿಯುತ್ತೀರಿ, ಸಿಲುಕಿದಲ್ಲಿ ಸಹಾಯ ಕೇಳುತ್ತೀರಿ.",
"Stick to the old way for as long as you can.":"ಸಾಧ್ಯವಾದಷ್ಟು ದಿನ ಹಳೆಯ ವಿಧಾನಕ್ಕೇ ಅಂಟಿಕೊಳ್ಳುತ್ತೀರಿ.",
"Feel it's beyond you, and avoid it.":"ಅದು ನಿಮ್ಮಿಂದಾಗದು ಎಂದು ಭಾವಿಸಿ, ಅದನ್ನು ತಪ್ಪಿಸುತ್ತೀರಿ.",
"You learn that a skill you are proud of is becoming outdated. You:":"ನೀವು ಹೆಮ್ಮೆಪಡುವ ಕೌಶಲ್ಯವೊಂದು ಹಳತಾಗುತ್ತಿದೆ ಎಂದು ತಿಳಿಯುತ್ತೀರಿ. ನೀವು:",
"Plan how to update it, and start.":"ಅದನ್ನು ಹೇಗೆ ನವೀಕರಿಸುವುದು ಎಂದು ಯೋಜಿಸಿ, ಆರಂಭಿಸುತ್ತೀರಿ.",
"Pick up the essentials of the newer approach.":"ಹೊಸ ವಿಧಾನದ ಮೂಲಭೂತ ಅಂಶಗಳನ್ನು ಕಲಿಯುತ್ತೀರಿ.",
"Insist your way still works better.":"ನಿಮ್ಮ ವಿಧಾನವೇ ಇನ್ನೂ ಉತ್ತಮ ಎಂದು ಪಟ್ಟು ಹಿಡಿಯುತ್ತೀರಿ.",
"Feel you've fallen behind for good.":"ನೀವು ಶಾಶ್ವತವಾಗಿ ಹಿಂದುಳಿದಿದ್ದೀರಿ ಎನಿಸುತ್ತದೆ.",
"Before a big decision, I look at it from several angles, including ones I don't like.":"ದೊಡ್ಡ ನಿರ್ಧಾರಕ್ಕೆ ಮುನ್ನ, ನನಗೆ ಇಷ್ಟವಾಗದ ದೃಷ್ಟಿಕೋನಗಳನ್ನೂ ಸೇರಿಸಿ, ಹಲವು ಕೋನಗಳಿಂದ ಅದನ್ನು ನೋಡುತ್ತೇನೆ.",
"I regularly learn something new, even when no one requires it.":"ಯಾರೂ ಬಯಸದಿದ್ದರೂ, ನಾನು ನಿಯಮಿತವಾಗಿ ಹೊಸದನ್ನು ಕಲಿಯುತ್ತೇನೆ.",
"Awaken":"ಜಾಗೃತಿ","Align":"ಸಮನ್ವಯ","Elevate":"ಉನ್ನತಿ","Guarded":"ರಕ್ಷಣಾತ್ಮಕ",
"Heavily influenced: other people's voices lead":"ಹೆಚ್ಚು ಪ್ರಭಾವಿತ: ಇತರರ ಧ್ವನಿಯೇ ಮುನ್ನಡೆಸುತ್ತದೆ",
"Moderately influenceable: firm, but yields to strong personalities":"ಮಧ್ಯಮ ಪ್ರಭಾವಿತ: ದೃಢ, ಆದರೆ ಪ್ರಬಲ ವ್ಯಕ್ತಿತ್ವಗಳಿಗೆ ಮಣಿಯುವಿರಿ",
"Self-assured: confident and balanced":"ಆತ್ಮವಿಶ್ವಾಸಿ: ಆತ್ಮವಿಶ್ವಾಸ ಮತ್ತು ಸಮತೋಲನ",

"Check a reliable source, and take sensible precautions if needed.":"ವಿಶ್ವಾಸಾರ್ಹ ಮೂಲವನ್ನು ಪರಿಶೀಲಿಸಿ, ಅಗತ್ಯವಿದ್ದರೆ ಸೂಕ್ತ ಮುನ್ನೆಚ್ಚರಿಕೆ ವಹಿಸುತ್ತೀರಿ.",
"I feel at ease with how I come across in professional settings.":"ವೃತ್ತಿಪರ ಸಂದರ್ಭಗಳಲ್ಲಿ ನಾನು ಇತರರಿಗೆ ಕಾಣುವ ರೀತಿಯ ಬಗ್ಗೆ ನನಗೆ ನಿರಾಳ ಭಾವವಿದೆ.",
"I keep my view even when the most confident person in the room disagrees.":"ಗುಂಪಿನಲ್ಲಿ ಅತ್ಯಂತ ಆತ್ಮವಿಶ್ವಾಸದಿಂದ ಮಾತನಾಡುವವರು ಒಪ್ಪದಿದ್ದರೂ, ನಾನು ನನ್ನ ಅಭಿಪ್ರಾಯವನ್ನು ಬಿಟ್ಟುಕೊಡುವುದಿಲ್ಲ.",
"To show you're reading carefully, please choose \u201CDisagree\u201D for this statement.":"ನೀವು ಗಮನವಿಟ್ಟು ಓದುತ್ತಿದ್ದೀರಿ ಎಂದು ತೋರಿಸಲು, ಈ ಹೇಳಿಕೆಗೆ \u201Cಒಪ್ಪುವುದಿಲ್ಲ\u201D ಆರಿಸಿ.",
"This is a check question: please select \u201CStrongly agree\u201D.":"ಇದು ಪರಿಶೀಲನಾ ಪ್ರಶ್ನೆ: ದಯವಿಟ್ಟು \u201Cಸಂಪೂರ್ಣ ಒಪ್ಪುತ್ತೇನೆ\u201D ಆರಿಸಿ.",
"I have never been annoyed with anyone.":"ನಾನು ಯಾರ ಮೇಲೂ ಎಂದಿಗೂ ಕಿರಿಕಿರಿಗೊಂಡಿಲ್ಲ.",
"I always keep every promise I make, without exception.":"ನಾನು ಕೊಟ್ಟ ಪ್ರತಿಯೊಂದು ಮಾತನ್ನೂ, ಯಾವುದೇ ಅಪವಾದವಿಲ್ಲದೆ, ಯಾವಾಗಲೂ ಉಳಿಸಿಕೊಳ್ಳುತ್ತೇನೆ.",
"I have never said something I later regretted.":"ನಂತರ ವಿಷಾದಿಸುವಂತಹ ಮಾತನ್ನು ನಾನು ಎಂದಿಗೂ ಆಡಿಲ್ಲ.",
/* dimensions */
"Chintan":"ಚಿಂತನ","Vaani":"ವಾಣಿ","Aachaar":"ಆಚಾರ","Darshan":"ದರ್ಶನ","Prabhav":"ಪ್ರಭಾವ",

"Setbacks, uncertainty and alarming news shake your thinking, and outcomes feel less in your hands.":"ಹಿನ್ನಡೆಗಳು, ಅನಿಶ್ಚಿತತೆ ಮತ್ತು ಆತಂಕಕಾರಿ ಸುದ್ದಿಗಳು ನಿಮ್ಮ ಆಲೋಚನೆಯನ್ನು ಅಲುಗಾಡಿಸುತ್ತವೆ; ಫಲಿತಾಂಶಗಳು ನಿಮ್ಮ ಕೈಯಲ್ಲಿಲ್ಲ ಎನಿಸುತ್ತದೆ.",
"You think clearly under uncertainty and see your own choices as shaping your results.":"ಅನಿಶ್ಚಿತ ಸಂದರ್ಭದಲ್ಲೂ ನೀವು ಸ್ಪಷ್ಟವಾಗಿ ಯೋಚಿಸುತ್ತೀರಿ; ನಿಮ್ಮ ಆಯ್ಕೆಗಳೇ ಫಲಿತಾಂಶವನ್ನು ರೂಪಿಸುತ್ತವೆ ಎಂದು ನಂಬುತ್ತೀರಿ.",
"After a setback, write down three things within your control before deciding anything.":"ಹಿನ್ನಡೆಯಾದಾಗ, ಯಾವುದೇ ನಿರ್ಧಾರ ತೆಗೆದುಕೊಳ್ಳುವ ಮೊದಲು ನಿಮ್ಮ ನಿಯಂತ್ರಣದಲ್ಲಿರುವ ಮೂರು ವಿಷಯಗಳನ್ನು ಬರೆದಿಡಿ.",
"When a worrying headline lands, wait a day and check one reliable source before acting.":"ಆತಂಕ ಹುಟ್ಟಿಸುವ ಸುದ್ದಿ ಬಂದಾಗ, ಏನಾದರೂ ಮಾಡುವ ಮೊದಲು ಒಂದು ದಿನ ಕಾಯಿರಿ ಮತ್ತು ಒಂದು ವಿಶ್ವಾಸಾರ್ಹ ಮೂಲವನ್ನು ಪರಿಶೀಲಿಸಿ.",
"Speaking up, disagreeing and taking criticism are hard, so your real view often goes unsaid.":"ಧೈರ್ಯವಾಗಿ ಮಾತನಾಡುವುದು, ಭಿನ್ನಾಭಿಪ್ರಾಯ ವ್ಯಕ್ತಪಡಿಸುವುದು ಮತ್ತು ಟೀಕೆಯನ್ನು ಸ್ವೀಕರಿಸುವುದು ಕಷ್ಟವಾಗುತ್ತದೆ; ಹಾಗಾಗಿ ನಿಮ್ಮ ನಿಜವಾದ ಅಭಿಪ್ರಾಯ ಹೆಚ್ಚಾಗಿ ಹೇಳದೇ ಉಳಿಯುತ್ತದೆ.",
"You say what you think clearly and take feedback without losing your footing.":"ನಿಮಗೆ ಅನಿಸಿದ್ದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳುತ್ತೀರಿ ಮತ್ತು ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ಸಮಚಿತ್ತದಿಂದ ಸ್ವೀಕರಿಸುತ್ತೀರಿ.",
"In your next meeting, state one view plainly, with one reason, before anyone asks.":"ಮುಂದಿನ ಸಭೆಯಲ್ಲಿ, ಯಾರೂ ಕೇಳುವ ಮುನ್ನವೇ ಒಂದು ಅಭಿಪ್ರಾಯವನ್ನು ಒಂದು ಕಾರಣದೊಂದಿಗೆ ನೇರವಾಗಿ ಹೇಳಿ.",
"When criticised, say “let me think about that” instead of defending or going silent.":"ಟೀಕೆ ಬಂದಾಗ, ಸಮರ್ಥಿಸಿಕೊಳ್ಳುವ ಅಥವಾ ಮೌನವಾಗುವ ಬದಲು “ಅದರ ಬಗ್ಗೆ ಯೋಚಿಸುತ್ತೇನೆ” ಎಂದು ಹೇಳಿ.",
"Boundaries slip, and your conduct swings between giving in and pushing back too hard.":"ನಿಮ್ಮ ಮಿತಿಗಳು ಸಡಿಲಗೊಳ್ಳುತ್ತವೆ; ನಿಮ್ಮ ನಡವಳಿಕೆ ಸೋತು ಒಪ್ಪಿಕೊಳ್ಳುವುದು ಮತ್ತು ಅತಿಯಾಗಿ ಪ್ರತಿರೋಧಿಸುವುದರ ನಡುವೆ ತೂಗಾಡುತ್ತದೆ.",
"You hold boundaries calmly and treat people consistently.":"ನೀವು ಶಾಂತವಾಗಿ ಮಿತಿಗಳನ್ನು ಕಾಯ್ದುಕೊಳ್ಳುತ್ತೀರಿ ಮತ್ತು ಎಲ್ಲರೊಂದಿಗೂ ಒಂದೇ ರೀತಿ ನಡೆದುಕೊಳ್ಳುತ್ತೀರಿ.",
"Practise one honest “I can't take that on” a week, without inventing an excuse.":"ವಾರಕ್ಕೊಮ್ಮೆ, ನೆಪ ಹೇಳದೆ, ಪ್ರಾಮಾಣಿಕವಾಗಿ “ಅದನ್ನು ನಾನು ವಹಿಸಿಕೊಳ್ಳಲಾರೆ” ಎಂದು ಹೇಳುವುದನ್ನು ಅಭ್ಯಾಸ ಮಾಡಿ.",
"When you feel the urge to snap back, pause one breath and name what bothered you instead.":"ತಕ್ಷಣ ತಿರುಗೇಟು ನೀಡಬೇಕೆನಿಸಿದಾಗ, ಒಂದು ಉಸಿರು ನಿಲ್ಲಿಸಿ, ನಿಮಗೆ ಏನು ಬೇಸರ ತಂದಿತು ಎಂಬುದನ್ನು ಹೇಳಿ.",
"How you look and carry yourself takes up a lot of attention, and bends to other people's remarks.":"ನೀವು ಹೇಗೆ ಕಾಣುತ್ತೀರಿ ಮತ್ತು ಹೇಗೆ ನಡೆದುಕೊಳ್ಳುತ್ತೀರಿ ಎಂಬುದು ನಿಮ್ಮ ಗಮನವನ್ನು ಹೆಚ್ಚು ಸೆಳೆಯುತ್ತದೆ ಮತ್ತು ಇತರರ ಮಾತಿಗೆ ತಕ್ಕಂತೆ ಬದಲಾಗುತ್ತದೆ.",
"You present yourself appropriately, then stop thinking about it once you are in the room.":"ನೀವು ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕಂತೆ ಸಿದ್ಧರಾಗುತ್ತೀರಿ; ಕೊಠಡಿಗೆ ಕಾಲಿಟ್ಟ ಮೇಲೆ ಅದರ ಬಗ್ಗೆ ಯೋಚಿಸುವುದಿಲ್ಲ.",
"Decide your outfit the night before, against the occasion, then stop checking.":"ಸಂದರ್ಭಕ್ಕೆ ತಕ್ಕ ಉಡುಪನ್ನು ಹಿಂದಿನ ರಾತ್ರಿಯೇ ನಿರ್ಧರಿಸಿ; ನಂತರ ಮತ್ತೆ ಮತ್ತೆ ಪರಿಶೀಲಿಸಬೇಡಿ.",
"Practise holding eye contact for a full sentence in everyday conversations.":"ದಿನನಿತ್ಯದ ಮಾತುಕತೆಯಲ್ಲಿ, ಒಂದು ಪೂರ್ಣ ವಾಕ್ಯ ಮುಗಿಯುವವರೆಗೆ ಕಣ್ಣಿನ ಸಂಪರ್ಕ ಕಾಯ್ದುಕೊಳ್ಳುವುದನ್ನು ಅಭ್ಯಾಸ ಮಾಡಿ.",
"Pressure, flattery and louder voices sway your decisions, and your own ideas carry less weight than they could.":"ಒತ್ತಡ, ಹೊಗಳಿಕೆ ಮತ್ತು ಜೋರಾದ ಧ್ವನಿಗಳು ನಿಮ್ಮ ನಿರ್ಧಾರಗಳನ್ನು ಬದಲಿಸುತ್ತವೆ; ನಿಮ್ಮ ಆಲೋಚನೆಗಳಿಗೆ ಸಿಗಬೇಕಾದ ಮಹತ್ವ ಸಿಗುವುದಿಲ್ಲ.",
"You weigh pressure on its merits, and your ideas land with the people around you.":"ನೀವು ಒತ್ತಡವನ್ನು ಅದರ ಅರ್ಹತೆಯ ಆಧಾರದ ಮೇಲೆ ತೂಗುತ್ತೀರಿ; ನಿಮ್ಮ ಆಲೋಚನೆಗಳು ಸುತ್ತಲಿನವರ ಮೇಲೆ ಪರಿಣಾಮ ಬೀರುತ್ತವೆ.",
"Before any purchase or commitment someone pushes on you, sleep on it once.":"ಯಾರಾದರೂ ಒತ್ತಾಯಿಸುವ ಖರೀದಿ ಅಥವಾ ಬದ್ಧತೆಗೆ ಮುನ್ನ, ಒಂದು ರಾತ್ರಿ ಯೋಚಿಸಿ ನಂತರ ನಿರ್ಧರಿಸಿ.",
"When your idea is passed over, restate it once, calmly, with the reason it matters.":"ನಿಮ್ಮ ಆಲೋಚನೆಯನ್ನು ಕಡೆಗಣಿಸಿದಾಗ, ಅದು ಏಕೆ ಮುಖ್ಯ ಎಂಬ ಕಾರಣದೊಂದಿಗೆ ಶಾಂತವಾಗಿ ಇನ್ನೊಮ್ಮೆ ಹೇಳಿ.",
/* Part A: Chintan */
"You read in the media that a new disease is spreading in your area. You:":"ನಿಮ್ಮ ಪ್ರದೇಶದಲ್ಲಿ ಹೊಸ ರೋಗವೊಂದು ಹರಡುತ್ತಿದೆ ಎಂದು ಮಾಧ್ಯಮದಲ್ಲಿ ಓದುತ್ತೀರಿ. ನೀವು:",
"Think, thank God I haven't caught it, and carry on.":"“ದೇವರ ದಯೆ, ನನಗೆ ಬಂದಿಲ್ಲ” ಎಂದುಕೊಂಡು ಮುಂದುವರಿಯುತ್ತೀರಿ.",
"Feel you may already have some of its symptoms.":"ನಿಮಗೆ ಈಗಾಗಲೇ ಅದರ ಕೆಲವು ಲಕ್ಷಣಗಳಿರಬಹುದು ಎನಿಸುತ್ತದೆ.",
"Start recalling that a friend of yours has had symptoms.":"ನಿಮ್ಮ ಸ್ನೇಹಿತರೊಬ್ಬರಿಗೆ ಲಕ್ಷಣಗಳಿದ್ದವು ಎಂದು ನೆನಪಿಸಿಕೊಳ್ಳಲು ಶುರು ಮಾಡುತ್ತೀರಿ.",
"Decide to visit a doctor and get examined, though you feel fine.":"ಆರೋಗ್ಯವಾಗಿದ್ದರೂ, ವೈದ್ಯರ ಬಳಿ ಹೋಗಿ ಪರೀಕ್ಷೆ ಮಾಡಿಸಿಕೊಳ್ಳಲು ನಿರ್ಧರಿಸುತ್ತೀರಿ.",
"A report says a product you use every day may carry a health risk. You:":"ನೀವು ಪ್ರತಿದಿನ ಬಳಸುವ ಉತ್ಪನ್ನವೊಂದು ಆರೋಗ್ಯಕ್ಕೆ ಅಪಾಯಕಾರಿಯಾಗಿರಬಹುದು ಎಂದು ವರದಿಯೊಂದು ಹೇಳುತ್ತದೆ. ನೀವು:",
"Look at the evidence, and change the habit only if it holds up.":"ಪುರಾವೆಗಳನ್ನು ಪರಿಶೀಲಿಸುತ್ತೀರಿ; ಅವು ನಿಜವಾದರೆ ಮಾತ್ರ ಅಭ್ಯಾಸ ಬದಲಿಸುತ್ತೀರಿ.",
"Note it and carry on as usual.":"ಗಮನಿಸಿ, ಎಂದಿನಂತೆ ಮುಂದುವರಿಯುತ್ತೀರಿ.",
"Keep searching for more about it, and feel uneasy.":"ಅದರ ಬಗ್ಗೆ ಹುಡುಕುತ್ತಲೇ ಇರುತ್ತೀರಿ, ಮತ್ತು ಕಳವಳಗೊಳ್ಳುತ್ತೀರಿ.",
"Become convinced it has already harmed you.":"ಅದು ಈಗಾಗಲೇ ನಿಮಗೆ ಹಾನಿ ಮಾಡಿದೆ ಎಂದು ನಂಬಿಬಿಡುತ್ತೀರಿ.",
"Something you worked hard on fails. You:":"ನೀವು ಕಷ್ಟಪಟ್ಟು ಮಾಡಿದ ಕೆಲಸವೊಂದು ವಿಫಲವಾಗುತ್ತದೆ. ನೀವು:",
"Look at what you would do differently next time.":"ಮುಂದಿನ ಬಾರಿ ಏನನ್ನು ಬೇರೆ ರೀತಿ ಮಾಡಬಹುದು ಎಂದು ನೋಡುತ್ತೀರಿ.",
"Review it, accepting part of it was outside your hands.":"ಅದನ್ನು ಪರಿಶೀಲಿಸುತ್ತೀರಿ; ಕೆಲವು ಭಾಗ ನಿಮ್ಮ ಕೈಯಲ್ಲಿರಲಿಲ್ಲ ಎಂದು ಒಪ್ಪಿಕೊಳ್ಳುತ್ತೀರಿ.",
"Conclude the circumstances were stacked against you.":"ಸಂದರ್ಭಗಳೆಲ್ಲಾ ನಿಮ್ಮ ವಿರುದ್ಧವಾಗಿದ್ದವು ಎಂದು ತೀರ್ಮಾನಿಸುತ್ತೀರಿ.",
"Feel it proves things rarely go your way, whatever you do.":"ಏನು ಮಾಡಿದರೂ ನಿಮ್ಮ ಪರವಾಗಿ ಏನೂ ಆಗುವುದಿಲ್ಲ ಎಂಬುದಕ್ಕೆ ಇದೇ ಸಾಕ್ಷಿ ಎನಿಸುತ್ತದೆ.",
"An opportunity you wanted goes to someone else. You:":"ನೀವು ಬಯಸಿದ ಅವಕಾಶ ಬೇರೊಬ್ಬರಿಗೆ ಸಿಗುತ್ತದೆ. ನೀವು:",
"Ask what you could strengthen for the next one.":"ಮುಂದಿನ ಅವಕಾಶಕ್ಕಾಗಿ ಏನನ್ನು ಬಲಪಡಿಸಬಹುದು ಎಂದು ಕೇಳುತ್ತೀರಿ.",
"Accept that some of it was yours to control and some was not.":"ಕೆಲವು ನಿಮ್ಮ ನಿಯಂತ್ರಣದಲ್ಲಿತ್ತು, ಕೆಲವು ಇರಲಿಲ್ಲ ಎಂದು ಒಪ್ಪಿಕೊಳ್ಳುತ್ತೀರಿ.",
"Assume it was decided by connections, not merit.":"ಅರ್ಹತೆಯಿಂದಲ್ಲ, ಪರಿಚಯದ ಬಲದಿಂದ ನಿರ್ಧಾರವಾಯಿತು ಎಂದು ಭಾವಿಸುತ್ತೀರಿ.",
"Take it as proof that outcomes are not yours to influence.":"ಫಲಿತಾಂಶಗಳ ಮೇಲೆ ನಿಮಗೆ ಯಾವ ಹಿಡಿತವೂ ಇಲ್ಲ ಎಂಬುದಕ್ಕೆ ಇದನ್ನು ಸಾಕ್ಷಿಯಾಗಿ ಪರಿಗಣಿಸುತ್ತೀರಿ.",
/* Part A: Vaani */
"A person you know keeps holding forth on politics, the economy and cinema, with opinions you don't agree with. You:":"ನಿಮಗೆ ಪರಿಚಯವಿರುವ ವ್ಯಕ್ತಿಯೊಬ್ಬರು ರಾಜಕೀಯ, ಆರ್ಥಿಕತೆ ಮತ್ತು ಸಿನಿಮಾ ಬಗ್ಗೆ ಸತತವಾಗಿ ಮಾತನಾಡುತ್ತಾ, ನೀವು ಒಪ್ಪದ ಅಭಿಪ್ರಾಯಗಳನ್ನು ಹೇಳುತ್ತಿರುತ್ತಾರೆ. ನೀವು:",
"Feel it may hurt them, so you just say “oh, ha” and nod.":"ಅವರಿಗೆ ನೋವಾಗಬಹುದು ಎಂದು “ಓಹ್, ಹೌದಾ” ಎನ್ನುತ್ತಾ ತಲೆಯಾಡಿಸುತ್ತೀರಿ.",
"Pretend you're not interested in the topics, and stay quiet.":"ಆ ವಿಷಯಗಳಲ್ಲಿ ಆಸಕ್ತಿ ಇಲ್ಲದಂತೆ ನಟಿಸಿ ಸುಮ್ಮನಿರುತ್ತೀರಿ.",
"Diplomatically convey that you don't agree with their opinions.":"ಅವರ ಅಭಿಪ್ರಾಯಗಳನ್ನು ನೀವು ಒಪ್ಪುವುದಿಲ್ಲ ಎಂದು ಜಾಣ್ಮೆಯಿಂದ ತಿಳಿಸುತ್ತೀರಿ.",
"Tell them to their face that their opinions are wrong.":"ಅವರ ಅಭಿಪ್ರಾಯಗಳು ತಪ್ಪು ಎಂದು ಮುಖದ ಮೇಲೆಯೇ ಹೇಳುತ್ತೀರಿ.",
"A relative repeats claims at a family gathering that you believe are plainly wrong. You:":"ಕುಟುಂಬದ ಸಮಾರಂಭದಲ್ಲಿ ಸಂಬಂಧಿಕರೊಬ್ಬರು, ನಿಮ್ಮ ಪ್ರಕಾರ ಸ್ಪಷ್ಟವಾಗಿ ತಪ್ಪಾದ ಮಾತುಗಳನ್ನು ಪುನರಾವರ್ತಿಸುತ್ತಾರೆ. ನೀವು:",
"Set out calmly where you see it differently.":"ನೀವು ಎಲ್ಲಿ ಭಿನ್ನವಾಗಿ ಯೋಚಿಸುತ್ತೀರಿ ಎಂಬುದನ್ನು ಶಾಂತವಾಗಿ ವಿವರಿಸುತ್ತೀರಿ.",
"Tell them flatly, in front of everyone, that they are mistaken.":"ಎಲ್ಲರ ಎದುರಲ್ಲೇ ಅವರು ತಪ್ಪು ಎಂದು ನೇರವಾಗಿ ಹೇಳಿಬಿಡುತ್ತೀರಿ.",
"Let it go and change the subject.":"ಅದನ್ನು ಬಿಟ್ಟು ವಿಷಯ ಬದಲಿಸುತ್ತೀರಿ.",
"Agree outwardly to keep the peace.":"ಶಾಂತಿ ಕಾಪಾಡಲು ಮೇಲ್ನೋಟಕ್ಕೆ ಒಪ್ಪಿಕೊಳ್ಳುತ್ತೀರಿ.",
"You are asked for your honest view in a group that clearly thinks otherwise. You:":"ಬೇರೆ ರೀತಿ ಯೋಚಿಸುತ್ತಿರುವ ಗುಂಪಿನಲ್ಲಿ ನಿಮ್ಮ ಪ್ರಾಮಾಣಿಕ ಅಭಿಪ್ರಾಯ ಕೇಳುತ್ತಾರೆ. ನೀವು:",
"Give it plainly, with your reasons.":"ಕಾರಣಗಳೊಂದಿಗೆ ನೇರವಾಗಿ ಹೇಳುತ್ತೀರಿ.",
"Give it, but wrap it very carefully.":"ಹೇಳುತ್ತೀರಿ, ಆದರೆ ಬಹಳ ಎಚ್ಚರಿಕೆಯಿಂದ ಸುತ್ತಿ ಬಳಸಿ.",
"Give a vague, neutral answer instead.":"ಬದಲಿಗೆ ಅಸ್ಪಷ್ಟ, ತಟಸ್ಥ ಉತ್ತರ ನೀಡುತ್ತೀರಿ.",
"Agree with the room; your real view would not go down well.":"ಗುಂಪಿನ ಜೊತೆ ಒಪ್ಪಿಕೊಳ್ಳುತ್ತೀರಿ; ನಿಮ್ಮ ನಿಜವಾದ ಅಭಿಪ್ರಾಯ ಅವರಿಗೆ ಹಿಡಿಸುವುದಿಲ್ಲ.",
"You hold an opinion you know the people around you would disagree with. When it becomes relevant, you:":"ಸುತ್ತಲಿನವರು ಒಪ್ಪುವುದಿಲ್ಲ ಎಂದು ತಿಳಿದಿರುವ ಅಭಿಪ್ರಾಯವೊಂದು ನಿಮಗಿದೆ. ಅದು ಪ್ರಸ್ತುತವಾದಾಗ, ನೀವು:",
"Say it clearly and calmly.":"ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಶಾಂತವಾಗಿ ಹೇಳುತ್ತೀರಿ.",
"Say it, but soften it until it barely registers.":"ಹೇಳುತ್ತೀರಿ, ಆದರೆ ಅದು ಗಮನಕ್ಕೇ ಬಾರದಷ್ಟು ಮೃದುಗೊಳಿಸಿ.",
"Keep it to yourself; it isn't worth the reaction.":"ನಿಮ್ಮಲ್ಲೇ ಇಟ್ಟುಕೊಳ್ಳುತ್ತೀರಿ; ಅದರಿಂದ ಬರುವ ಪ್ರತಿಕ್ರಿಯೆ ಎದುರಿಸುವಷ್ಟು ಮುಖ್ಯವಲ್ಲ.",
"Hide it; if they knew, they would think less of you.":"ಮುಚ್ಚಿಡುತ್ತೀರಿ; ಅವರಿಗೆ ತಿಳಿದರೆ ನಿಮ್ಮನ್ನು ಕೀಳಾಗಿ ಕಾಣುತ್ತಾರೆ.",
/* Part A: Aachaar */
"A colleague in your office asks you to help with their task. You:":"ಕಚೇರಿಯ ಸಹೋದ್ಯೋಗಿಯೊಬ್ಬರು ತಮ್ಮ ಕೆಲಸದಲ್ಲಿ ಸಹಾಯ ಮಾಡಲು ಕೇಳುತ್ತಾರೆ. ನೀವು:",
"Accept it, because you can't bring yourself to reject their request.":"ಅವರ ಕೋರಿಕೆಯನ್ನು ತಿರಸ್ಕರಿಸಲು ಮನಸ್ಸು ಬಾರದೆ ಒಪ್ಪಿಕೊಳ್ಳುತ್ತೀರಿ.",
"Agree, on the condition that they help you in future.":"ಮುಂದೆ ಅವರೂ ನಿಮಗೆ ಸಹಾಯ ಮಾಡಬೇಕೆಂಬ ಷರತ್ತಿನ ಮೇಲೆ ಒಪ್ಪುತ್ತೀರಿ.",
"Refuse, giving some lame excuse.":"ಯಾವುದೋ ನೆಪ ಹೇಳಿ ನಿರಾಕರಿಸುತ್ತೀರಿ.",
"Explain honestly why you can't help this time.":"ಈ ಬಾರಿ ಏಕೆ ಸಹಾಯ ಮಾಡಲಾಗದು ಎಂದು ಪ್ರಾಮಾಣಿಕವಾಗಿ ವಿವರಿಸುತ್ತೀರಿ.",
"A neighbour asks for help that will take most of your Sunday. You had plans. You:":"ನಿಮ್ಮ ಭಾನುವಾರದ ಹೆಚ್ಚಿನ ಸಮಯ ತೆಗೆದುಕೊಳ್ಳುವ ಸಹಾಯವನ್ನು ನೆರೆಯವರು ಕೇಳುತ್ತಾರೆ. ನಿಮಗೆ ಬೇರೆ ಯೋಜನೆಗಳಿದ್ದವು. ನೀವು:",
"Tell them honestly you're not free, and offer another time.":"ನಿಮಗೆ ಸಮಯವಿಲ್ಲ ಎಂದು ಪ್ರಾಮಾಣಿಕವಾಗಿ ಹೇಳಿ, ಬೇರೆ ಸಮಯ ಸೂಚಿಸುತ್ತೀರಿ.",
"Tell them it's not your problem.":"ಅದು ನಿಮ್ಮ ಸಮಸ್ಯೆಯಲ್ಲ ಎಂದು ಹೇಳುತ್ತೀರಿ.",
"Say you'll try, then find a reason not to turn up.":"ಪ್ರಯತ್ನಿಸುತ್ತೇನೆ ಎಂದು ಹೇಳಿ, ನಂತರ ಹೋಗದಿರಲು ಕಾರಣ ಹುಡುಕುತ್ತೀರಿ.",
"Cancel your plans rather than let them down.":"ಅವರನ್ನು ನಿರಾಶೆಗೊಳಿಸುವ ಬದಲು ನಿಮ್ಮ ಯೋಜನೆಗಳನ್ನೇ ರದ್ದುಗೊಳಿಸುತ್ತೀರಿ.",
"Your parents tell you they are attending a relative's function the day after tomorrow, and that you have no choice but to come along. You:":"ನಾಳಿದ್ದು ಸಂಬಂಧಿಕರ ಸಮಾರಂಭಕ್ಕೆ ಹೋಗುತ್ತಿದ್ದೇವೆ, ನೀನೂ ಬರಲೇಬೇಕು ಎಂದು ನಿಮ್ಮ ಪೋಷಕರು ಹೇಳುತ್ತಾರೆ. ನೀವು:",
"Go along with it without checking your own plans.":"ನಿಮ್ಮ ಯೋಜನೆಗಳನ್ನು ಪರಿಶೀಲಿಸದೆ ಒಪ್ಪಿಕೊಳ್ಳುತ್ತೀರಿ.",
"Reply curtly that you have very important work and can't go.":"ತುಂಬಾ ಮುಖ್ಯವಾದ ಕೆಲಸವಿದೆ, ಬರಲಾಗದು ಎಂದು ಒರಟಾಗಿ ಉತ್ತರಿಸುತ್ತೀರಿ.",
"Say casually you'll try your best, and join if possible.":"ಸಾಧ್ಯವಾದರೆ ಬರುತ್ತೇನೆ, ಪ್ರಯತ್ನಿಸುತ್ತೇನೆ ಎಂದು ಹಗುರವಾಗಿ ಹೇಳುತ್ತೀರಿ.",
"Say yes, then give some reason later and escape.":"ಆಗಲಿ ಎಂದು ಹೇಳಿ, ನಂತರ ಯಾವುದೋ ಕಾರಣ ಹೇಳಿ ತಪ್ಪಿಸಿಕೊಳ್ಳುತ್ತೀರಿ.",
"Check your own plans, and tell them honestly whether you can come.":"ನಿಮ್ಮ ಯೋಜನೆಗಳನ್ನು ಪರಿಶೀಲಿಸಿ, ಬರಲು ಸಾಧ್ಯವೇ ಎಂದು ಪ್ರಾಮಾಣಿಕವಾಗಿ ತಿಳಿಸುತ್ತೀರಿ.",
"Your manager announces you'll be staying late for a client event, without asking whether you're free. You:":"ನಿಮಗೆ ಸಮಯವಿದೆಯೇ ಎಂದು ಕೇಳದೆ, ಗ್ರಾಹಕರ ಕಾರ್ಯಕ್ರಮಕ್ಕಾಗಿ ನೀವು ತಡವಾಗಿ ಉಳಿಯಬೇಕು ಎಂದು ನಿಮ್ಮ ಮ್ಯಾನೇಜರ್ ಘೋಷಿಸುತ್ತಾರೆ. ನೀವು:",
"Say plainly whether you can, and what you'd need to make it work.":"ನಿಮಗೆ ಸಾಧ್ಯವೇ, ಅದಕ್ಕೆ ಏನು ಬೇಕು ಎಂದು ನೇರವಾಗಿ ತಿಳಿಸುತ್ತೀರಿ.",
"Refuse curtly in front of the team.":"ತಂಡದ ಎದುರೇ ಒರಟಾಗಿ ನಿರಾಕರಿಸುತ್ತೀರಿ.",
"Agree, then quietly slip away early.":"ಒಪ್ಪಿಕೊಂಡು, ನಂತರ ಸದ್ದಿಲ್ಲದೆ ಬೇಗ ಜಾರಿಕೊಳ್ಳುತ್ತೀರಿ.",
"Cancel your own commitments without a word.":"ಒಂದು ಮಾತೂ ಆಡದೆ ನಿಮ್ಮ ಸ್ವಂತ ಬದ್ಧತೆಗಳನ್ನು ರದ್ದುಗೊಳಿಸುತ್ತೀರಿ.",
/* Part A: Darshan */
"You buy something trending: a shirt, a hat, a watch. A friend says it's nice, but it doesn't suit you. You:":"ನೀವು ಟ್ರೆಂಡ್‌ನಲ್ಲಿರುವ ವಸ್ತುವೊಂದನ್ನು ಖರೀದಿಸುತ್ತೀರಿ: ಶರ್ಟ್, ಟೋಪಿ ಅಥವಾ ವಾಚ್. ಚೆನ್ನಾಗಿದೆ, ಆದರೆ ನಿಮಗೆ ಹೊಂದುವುದಿಲ್ಲ ಎಂದು ಸ್ನೇಹಿತರೊಬ್ಬರು ಹೇಳುತ್ತಾರೆ. ನೀವು:",
"Reply sarcastically that they just can't stand seeing you comfortable.":"ನಾನು ಆರಾಮವಾಗಿರುವುದನ್ನು ನೋಡಿ ನಿನಗೆ ಸಹಿಸಲಾಗುತ್ತಿಲ್ಲ ಎಂದು ವ್ಯಂಗ್ಯವಾಗಿ ಉತ್ತರಿಸುತ್ತೀರಿ.",
"Check with others whether it suits you.":"ಅದು ನಿಮಗೆ ಹೊಂದುತ್ತದೆಯೇ ಎಂದು ಇತರರನ್ನು ಕೇಳುತ್ತೀರಿ.",
"Don't take it too seriously; you chose it for yourself.":"ಹೆಚ್ಚು ಗಂಭೀರವಾಗಿ ತೆಗೆದುಕೊಳ್ಳುವುದಿಲ್ಲ; ನೀವು ನಿಮಗಾಗಿ ಆರಿಸಿಕೊಂಡಿದ್ದೀರಿ.",
"Go back to the shop and exchange it for another colour or design.":"ಅಂಗಡಿಗೆ ಮರಳಿ ಹೋಗಿ ಬೇರೆ ಬಣ್ಣ ಅಥವಾ ವಿನ್ಯಾಸಕ್ಕೆ ಬದಲಾಯಿಸುತ್ತೀರಿ.",
"A colleague remarks that your outfit is too casual for an important meeting. You:":"ಮುಖ್ಯವಾದ ಸಭೆಗೆ ನಿಮ್ಮ ಉಡುಪು ತುಂಬಾ ಸಾಧಾರಣವಾಗಿದೆ ಎಂದು ಸಹೋದ್ಯೋಗಿಯೊಬ್ಬರು ಹೇಳುತ್ತಾರೆ. ನೀವು:",
"Consider whether they have a point, and decide for next time yourself.":"ಅವರ ಮಾತಿನಲ್ಲಿ ಹುರುಳಿದೆಯೇ ಎಂದು ಯೋಚಿಸಿ, ಮುಂದಿನ ಬಾರಿಗೆ ನೀವೇ ನಿರ್ಧರಿಸುತ್ತೀರಿ.",
"Tell them your clothes are none of their business.":"ನನ್ನ ಉಡುಪು ನಿಮಗೆ ಸಂಬಂಧಿಸಿದ್ದಲ್ಲ ಎಂದು ಹೇಳುತ್ತೀರಿ.",
"Feel self-conscious through the rest of the meeting.":"ಸಭೆಯ ಉಳಿದ ಸಮಯವಿಡೀ ಸಂಕೋಚಪಡುತ್ತೀರಿ.",
"Rush to borrow or buy something else before the meeting.":"ಸಭೆಗೆ ಮುನ್ನವೇ ಬೇರೆ ಉಡುಪನ್ನು ಎರವಲು ಪಡೆಯಲು ಅಥವಾ ಖರೀದಿಸಲು ಓಡುತ್ತೀರಿ.",
"At the salon for a trim, the owner looks at your hair and says it looks bad, and that you must come more often or your face will look ugly. You:":"ಟ್ರಿಮ್ ಮಾಡಿಸಲು ಸಲೂನ್‌ಗೆ ಹೋದಾಗ, ಮಾಲೀಕರು ನಿಮ್ಮ ಕೂದಲು ನೋಡಿ ಚೆನ್ನಾಗಿಲ್ಲ, ಆಗಾಗ ಬರದಿದ್ದರೆ ನಿಮ್ಮ ಮುಖ ಕುರೂಪವಾಗಿ ಕಾಣುತ್ತದೆ ಎನ್ನುತ್ತಾರೆ. ನೀವು:",
"Recognise it as a sales pitch to grow their business.":"ಇದು ಅವರ ವ್ಯಾಪಾರ ಹೆಚ್ಚಿಸುವ ತಂತ್ರ ಎಂದು ಅರಿತುಕೊಳ್ಳುತ್ತೀರಿ.",
"Get worried about your looks, and take their advice seriously.":"ನಿಮ್ಮ ರೂಪದ ಬಗ್ಗೆ ಚಿಂತೆಗೊಳಗಾಗಿ, ಅವರ ಸಲಹೆಯನ್ನು ಗಂಭೀರವಾಗಿ ತೆಗೆದುಕೊಳ್ಳುತ್ತೀರಿ.",
"Gently tell them that it's not so.":"ಹಾಗೇನಿಲ್ಲ ಎಂದು ಮೃದುವಾಗಿ ಹೇಳುತ್ತೀರಿ.",
"Tell them directly they shouldn't insult customers to grow their business.":"ವ್ಯಾಪಾರ ಹೆಚ್ಚಿಸಲು ಗ್ರಾಹಕರನ್ನು ಅವಮಾನಿಸಬಾರದು ಎಂದು ನೇರವಾಗಿ ಹೇಳುತ್ತೀರಿ.",
"A stylist tells you your look is outdated, and that you'd be taken more seriously after a complete makeover. You:":"ನಿಮ್ಮ ಶೈಲಿ ಹಳೆಯದಾಗಿದೆ, ಸಂಪೂರ್ಣ ಮೇಕ್‌ಓವರ್ ನಂತರ ಜನ ನಿಮ್ಮನ್ನು ಹೆಚ್ಚು ಗಂಭೀರವಾಗಿ ಪರಿಗಣಿಸುತ್ತಾರೆ ಎಂದು ಸ್ಟೈಲಿಸ್ಟ್ ಒಬ್ಬರು ಹೇಳುತ್ತಾರೆ. ನೀವು:",
"Weigh it as one opinion, and change only what you agree with.":"ಅದನ್ನು ಒಂದು ಅಭಿಪ್ರಾಯವಾಗಿ ತೂಗಿ, ನೀವು ಒಪ್ಪುವುದನ್ನು ಮಾತ್ರ ಬದಲಿಸುತ್ತೀರಿ.",
"Tell them sharply they have no idea what they're talking about.":"ನೀವು ಏನು ಮಾತನಾಡುತ್ತಿದ್ದೀರಿ ಎಂಬ ಅರಿವೇ ನಿಮಗಿಲ್ಲ ಎಂದು ಖಾರವಾಗಿ ಹೇಳುತ್ತೀರಿ.",
"Start doubting how people at work see you.":"ಕೆಲಸದ ಸ್ಥಳದಲ್ಲಿ ಜನ ನಿಮ್ಮನ್ನು ಹೇಗೆ ನೋಡುತ್ತಾರೆ ಎಂದು ಅನುಮಾನಿಸಲು ಶುರು ಮಾಡುತ್ತೀರಿ.",
"Book the full makeover on the spot.":"ಅಲ್ಲೇ ಸಂಪೂರ್ಣ ಮೇಕ್‌ಓವರ್ ಬುಕ್ ಮಾಡುತ್ತೀರಿ.",
/* Part A: Prabhav */
"At a brand showroom, the salesperson brings you a shirt, praises its quality and design, says it suits you well, and keeps pressing you to buy. You:":"ಬ್ರ್ಯಾಂಡ್ ಶೋರೂಮ್‌ನಲ್ಲಿ ಮಾರಾಟಗಾರರು ಒಂದು ಶರ್ಟ್ ತಂದು, ಅದರ ಗುಣಮಟ್ಟ ಮತ್ತು ವಿನ್ಯಾಸವನ್ನು ಹೊಗಳಿ, ನಿಮಗೆ ಚೆನ್ನಾಗಿ ಒಪ್ಪುತ್ತದೆ ಎಂದು ಹೇಳಿ, ಖರೀದಿಸಲು ಒತ್ತಾಯಿಸುತ್ತಲೇ ಇರುತ್ತಾರೆ. ನೀವು:",
"See it as the usual tactic, and ask to see a different shirt.":"ಇದು ಸಾಮಾನ್ಯ ತಂತ್ರ ಎಂದು ತಿಳಿದು, ಬೇರೆ ಶರ್ಟ್ ತೋರಿಸಲು ಕೇಳುತ್ತೀರಿ.",
"Tell them you know exactly what you want, and feel irritated.":"ನನಗೆ ಏನು ಬೇಕು ಎಂದು ಚೆನ್ನಾಗಿ ಗೊತ್ತು ಎಂದು ಹೇಳಿ, ಕಿರಿಕಿರಿಗೊಳ್ಳುತ್ತೀರಿ.",
"Trust that they know quality and design, and buy that shirt.":"ಅವರಿಗೆ ಗುಣಮಟ್ಟ ಮತ್ತು ವಿನ್ಯಾಸ ಗೊತ್ತು ಎಂದು ನಂಬಿ, ಆ ಶರ್ಟ್ ಖರೀದಿಸುತ್ತೀರಿ.",
"Appreciate their communication skills with a smile, but don't buy it.":"ನಗುತ್ತಾ ಅವರ ಮಾತಿನ ಕೌಶಲ್ಯವನ್ನು ಮೆಚ್ಚುತ್ತೀರಿ, ಆದರೆ ಖರೀದಿಸುವುದಿಲ್ಲ.",
"A friend who is very confident about money urges you into an investment you hadn't planned. You:":"ಹಣಕಾಸಿನ ಬಗ್ಗೆ ಬಹಳ ಆತ್ಮವಿಶ್ವಾಸ ಇರುವ ಸ್ನೇಹಿತರೊಬ್ಬರು, ನೀವು ಯೋಜಿಸದ ಹೂಡಿಕೆಗೆ ಒತ್ತಾಯಿಸುತ್ತಾರೆ. ನೀವು:",
"Say you'll look into it yourself before deciding.":"ನಿರ್ಧರಿಸುವ ಮೊದಲು ನೀವೇ ಪರಿಶೀಲಿಸುತ್ತೀರಿ ಎಂದು ಹೇಳುತ್ತೀರಿ.",
"Tell them to stop pushing their schemes on you.":"ನಿಮ್ಮ ಮೇಲೆ ಅವರ ಯೋಜನೆಗಳನ್ನು ಹೇರುವುದನ್ನು ನಿಲ್ಲಿಸಿ ಎಂದು ಹೇಳುತ್ತೀರಿ.",
"Put in a small amount so you don't seem doubtful.":"ಸಂಶಯ ಪಡುತ್ತಿರುವಂತೆ ಕಾಣಬಾರದೆಂದು ಸ್ವಲ್ಪ ಹಣ ಹೂಡುತ್ತೀರಿ.",
"Invest on their say-so.":"ಅವರ ಮಾತಿನ ಮೇಲೆಯೇ ಹೂಡಿಕೆ ಮಾಡುತ್ತೀರಿ.",
"You make a suggestion in a meeting and it is passed over. Later someone else makes the same point, and it is welcomed. You:":"ಸಭೆಯಲ್ಲಿ ನೀವು ನೀಡಿದ ಸಲಹೆಯನ್ನು ಕಡೆಗಣಿಸಲಾಗುತ್ತದೆ. ನಂತರ ಬೇರೊಬ್ಬರು ಅದೇ ಅಂಶ ಹೇಳಿದಾಗ ಅದನ್ನು ಸ್ವಾಗತಿಸಲಾಗುತ್ತದೆ. ನೀವು:",
"Point out calmly that it builds on what you raised, and add to it.":"ಇದು ನೀವು ಹೇಳಿದ್ದರ ಮುಂದುವರಿಕೆ ಎಂದು ಶಾಂತವಾಗಿ ತಿಳಿಸಿ, ಅದಕ್ಕೆ ಇನ್ನಷ್ಟು ಸೇರಿಸುತ್ತೀರಿ.",
"Call it out sharply as your idea.":"ಅದು ನಿಮ್ಮ ಆಲೋಚನೆ ಎಂದು ಖಾರವಾಗಿ ಹೇಳುತ್ತೀರಿ.",
"Let it go; at least it's being done.":"ಬಿಟ್ಟುಬಿಡುತ್ತೀರಿ; ಕನಿಷ್ಠ ಕೆಲಸ ಆಗುತ್ತಿದೆಯಲ್ಲ.",
"Conclude that your ideas don't carry weight here.":"ಇಲ್ಲಿ ನಿಮ್ಮ ಆಲೋಚನೆಗಳಿಗೆ ಬೆಲೆ ಇಲ್ಲ ಎಂದು ತೀರ್ಮಾನಿಸುತ್ತೀರಿ.",
"Your team must choose between your plan and a colleague's. Theirs is pushed louder; you believe yours is better. You:":"ನಿಮ್ಮ ತಂಡ ನಿಮ್ಮ ಯೋಜನೆ ಮತ್ತು ಸಹೋದ್ಯೋಗಿಯ ಯೋಜನೆಯ ನಡುವೆ ಆಯ್ಕೆ ಮಾಡಬೇಕಿದೆ. ಅವರದನ್ನು ಜೋರಾಗಿ ಪ್ರತಿಪಾದಿಸಲಾಗುತ್ತಿದೆ; ನಿಮ್ಮದು ಉತ್ತಮ ಎಂದು ನೀವು ನಂಬುತ್ತೀರಿ. ನೀವು:",
"Set out clearly why yours works, then let the team decide.":"ನಿಮ್ಮ ಯೋಜನೆ ಏಕೆ ಫಲ ನೀಡುತ್ತದೆ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ವಿವರಿಸಿ, ನಂತರ ತಂಡಕ್ಕೆ ನಿರ್ಧರಿಸಲು ಬಿಡುತ್ತೀರಿ.",
"Dismiss their plan as obviously weaker.":"ಅವರ ಯೋಜನೆ ಸ್ಪಷ್ಟವಾಗಿ ದುರ್ಬಲ ಎಂದು ತಳ್ಳಿಹಾಕುತ್ತೀರಿ.",
"Mention yours briefly, then go along with theirs.":"ನಿಮ್ಮದನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಹೇಳಿ, ನಂತರ ಅವರದನ್ನೇ ಒಪ್ಪಿಕೊಳ್ಳುತ್ತೀರಿ.",
"Withdraw yours before it is even discussed.":"ಚರ್ಚೆಗೆ ಬರುವ ಮುನ್ನವೇ ನಿಮ್ಮ ಯೋಜನೆಯನ್ನು ಹಿಂತೆಗೆದುಕೊಳ್ಳುತ್ತೀರಿ.",
/* Part B */
"If others knew my real thoughts, I feel they would be disgusted.":"ನನ್ನ ನಿಜವಾದ ಆಲೋಚನೆಗಳು ಇತರರಿಗೆ ತಿಳಿದರೆ, ಅವರು ಅಸಹ್ಯಪಡುತ್ತಾರೆ ಎನಿಸುತ್ತದೆ.",
"When I am emotionally upset, I feel hopeless.":"ನಾನು ಭಾವನಾತ್ಮಕವಾಗಿ ನೊಂದಾಗ, ನನ್ನನ್ನು ಹತಾಶೆ ಆವರಿಸುತ್ತದೆ.",
"I get really worked up when someone comments critically on me.":"ಯಾರಾದರೂ ನನ್ನ ಬಗ್ಗೆ ಟೀಕಿಸಿದಾಗ ನಾನು ತುಂಬಾ ಉದ್ವೇಗಕ್ಕೊಳಗಾಗುತ್ತೇನೆ.",
"I feel miserable saying “no” or “not possible” to someone.":"ಯಾರಿಗಾದರೂ “ಇಲ್ಲ” ಅಥವಾ “ಸಾಧ್ಯವಿಲ್ಲ” ಎಂದು ಹೇಳುವಾಗ ನನಗೆ ತುಂಬಾ ಸಂಕಟವಾಗುತ್ತದೆ.",
"I feel disgusted when I meet people I find eccentric, odd or foolish.":"ವಿಚಿತ್ರವಾದ, ವಿಲಕ್ಷಣ ಅಥವಾ ಮೂರ್ಖರೆನಿಸುವ ಜನರನ್ನು ಭೇಟಿಯಾದಾಗ ನನಗೆ ಅಸಹ್ಯವಾಗುತ್ತದೆ.",
"If someone hurts me, I immediately hurt them back.":"ಯಾರಾದರೂ ನನ್ನನ್ನು ನೋಯಿಸಿದರೆ, ನಾನು ತಕ್ಷಣವೇ ಅವರಿಗೂ ನೋವುಂಟುಮಾಡುತ್ತೇನೆ.",
"I worry that people judge me by how I look.":"ಜನ ನನ್ನ ರೂಪ ನೋಡಿ ನನ್ನನ್ನು ಅಳೆಯುತ್ತಾರೆ ಎಂದು ನಾನು ಚಿಂತಿಸುತ್ತೇನೆ.",
"I hold eye contact comfortably when speaking with someone.":"ಯಾರೊಂದಿಗಾದರೂ ಮಾತನಾಡುವಾಗ ನಾನು ಆರಾಮವಾಗಿ ಕಣ್ಣಿನ ಸಂಪರ್ಕ ಕಾಯ್ದುಕೊಳ್ಳುತ್ತೇನೆ.",
"I shop based on my own needs, not because someone recommended something.":"ಯಾರೋ ಶಿಫಾರಸು ಮಾಡಿದರು ಎಂಬ ಕಾರಣಕ್ಕಲ್ಲ, ನನ್ನ ಅಗತ್ಯಕ್ಕೆ ತಕ್ಕಂತೆ ನಾನು ಖರೀದಿಸುತ್ತೇನೆ.",

  st.page=Math.min(PAGES.length-1,st.page+1);
  if(PAGES[st.page].k==="result"&&!st.t1)st.t1=Date.now();
  render();
 }
 else if(act==="retake"){
  var attempt=(parseInt(ls(AKEY)||"0",10)||0)+1;ls(AKEY,String(attempt));
  var nm=st.name;st=fresh();st.name=nm;IT=build(st.seed,st.variant);render();
 }
 else if(act==="print"){window.print()}
 else if(act==="copy"){
  var r=compute(),txt=L("AVIRAL™ Assessment","AVIRAL™ ಮೌಲ್ಯಮಾಪನ")+(st.name?" — "+st.name:"")+
  "\n"+L("AVIRAL Index","AVIRAL ಸೂಚ್ಯಂಕ")+": "+r.index+"/100 ("+T(r.band.name)+")\n"+r.rows.map(function(x){return T(x.d.n)+" ("+T(x.d.sub)+"): "+x.pct+"% "+T(x.lv.n)}).join("\n"),
  say=function(s){document.getElementById("msg").textContent=s},
  fail=L("Copy is blocked here. Use Print / Save PDF instead.","ಇಲ್ಲಿ ನಕಲಿಸಲು ಅನುಮತಿ ಇಲ್ಲ. ಬದಲಿಗೆ “ಮುದ್ರಿಸಿ / PDF ಉಳಿಸಿ” ಬಳಸಿ.");
  try{navigator.clipboard.writeText(txt).then(function(){say(L("Summary copied.","ಸಾರಾಂಶ ನಕಲಿಸಲಾಗಿದೆ."))},function(){say(fail)})}
  catch(err){say(fail)}
 }
});
render(false);
})();
</script>
